<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our commitments to consultancies</title><style>body{font-family:Inter,system-ui,sans-serif;background:#070F22;color:#D6E9FF;margin:0;padding:24px;line-height:1.6}.wrap{max-width:820px;margin:0 auto}h1{color:#fff}details{border-top:1px solid rgba(140,178,255,.2);padding:10px 0}summary{cursor:pointer;color:#fff;font-weight:700;font-size:15px}.sub{color:#8FA9CE;font-size:12px}.tag{display:inline-block;border:1px solid rgba(74,222,128,.5);color:#4ade80;border-radius:999px;padding:2px 8px;font-size:10.5px;margin:6px 4px 0 0}</style></head><body><div class="wrap"><h1>Our commitments to consultancies</h1><p class="sub">Plain answers to the questions consultancies ask before trusting a platform that also serves applicants directly. Each answer names what enforces it in the software.</p><div id="q"></div><p class="sub">Legal text: <a style="color:#7EE6FF" href="/legal.html">sections 8, 21</a>. Questions: admin@foriforeign.com</p></div><script>fetch('/api/commitments').then(r=>r.json()).then(d=>{const e=t=>String(t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));document.getElementById('q').innerHTML=(d.items||[]).map(i=>'<details open><summary>'+e(i.q)+'</summary><p>'+e(i.a)+'</p><div>'+(i.enforced||[]).map(x=>'<span class="tag">'+e(x)+'</span>').join('')+'</div></details>').join('')})</script></body></html>
