<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our commitments to consultancies</title><style>body{font-family:Inter,system-ui,sans-serif;background:#F7F9FF;color:#0B1B3A;margin:0;padding:0 0 24px;line-height:1.6}.wrap{padding:0 24px}.wrap{max-width:820px;margin:0 auto}h1{color:#0B1B3A}details{border-top:1px solid #E3E9F6;padding:10px 0}summary{cursor:pointer;color:#0B1B3A;font-weight:700;font-size:15px}.sub{color:#7B88A3;font-size:12px}.tag{display:inline-block;border:1px solid rgba(74,222,128,.5);color:#4ade80;border-radius:999px;padding:2px 8px;font-size:10.5px;margin:6px 4px 0 0}.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#0B1B3A;font:800 22px Fraunces,serif;letter-spacing:-.01em}.brand img{width:36px;height:36px;display:block}.brand b{color:#1683FF}@media (max-width:640px){.brand span{display:none}.brand img{width:34px;height:34px}}</style><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/brand/ff-mark-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.json"><meta property="og:image" content="https://foriforeign.com/share.png"><meta name="twitter:card" content="summary_large_image"></head><body><header style="background:#fff;border-bottom:1px solid #E3E9F6"><div style="max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:12px 20px"><a class="brand" href="/" aria-label="Go to ForiForeign Home"><img src="/brand/ff-mark-64.png" srcset="/brand/ff-mark-64.png 1x, /brand/ff-mark-180.png 3x" alt="" width="36" height="36"><span>Fori<b>Foreign</b></span></a><nav><a href="/pricing.html" style="margin-left:18px;color:#3B4B6B;font-size:14px;text-decoration:none">Pricing</a><a href="/help.html" style="margin-left:18px;color:#3B4B6B;font-size:14px;text-decoration:none">Help</a><a href="/app#signin" style="margin-left:18px;background:#0B1B3A;color:#fff;padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none">Sign in</a></nav></div></header><div class="wrap"><h1>Our commitments to consultancies</h1><p class="sub">Plain answers to the questions consultancies ask before trusting a platform that also serves applicants directly. Each answer names what enforces it in the software.</p><div id="q"></div><p class="sub">Legal text: <a style="color:#1683FF" href="/legal.html">sections 8, 21</a>. Questions: admin@foriforeign.com</p></div><script>fetch('/api/commitments').then(r=>r.json()).then(d=>{const e=t=>String(t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));document.getElementById('q').innerHTML=(d.items||[]).map(i=>'<details open><summary>'+e(i.q)+'</summary><p>'+e(i.a)+'</p><div>'+(i.enforced||[]).map(x=>'<span class="tag">'+e(x)+'</span>').join('')+'</div></details>').join('')})</script></body></html>
