<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PostDocX — Academic Career Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A41;--ink-2:#24354F;--paper:#F3F5F7;--panel:#fff;--slate:#5C6C7D;--line:#DCE2E8;--soft:#EDF0F3;
--gold:#B8912E;--gold-soft:#F6EFDC;--green:#23745A;--green-soft:#E3F0EA;--crimson:#B23A2E;--crimson-soft:#F7E6E3;
--blue:#2C5F9E;--blue-soft:#E6EEF7;--r:12px;--shadow:0 1px 3px rgba(27,42,65,.08),0 4px 14px rgba(27,42,65,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14.5px;line-height:1.5}
.mono{font-family:'IBM Plex Mono',monospace}
header{background:var(--ink);color:#F4F1E8;padding:14px 18px 0;position:sticky;top:0;z-index:40}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:0 auto}
.brand h1{font-family:'Fraunces',serif;font-weight:700;font-size:23px;letter-spacing:-.3px}.brand h1 .x{color:var(--gold)}
.uname{font-size:12.5px;color:#9FB0C3}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1180px;margin:12px auto 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:none;color:#9FB0C3;font:600 13px 'Inter',sans-serif;padding:11px 14px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:color .15s}
nav button:hover{color:#D8E0EA}
nav button.on{color:#fff;border-bottom-color:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:18px 14px 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:4px;letter-spacing:-.15px}
.card .sub{color:var(--slate);font-size:12.5px;margin-bottom:12px}
.grid2{display:grid;gap:14px}@media(min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rail{display:flex;align-items:flex-start;overflow-x:auto;padding:6px 2px 2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;text-align:center;min-width:86px;position:relative}
.st .n{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px}
.st .l{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--slate);margin-top:2px}
.st .dot{width:11px;height:11px;border-radius:50%;background:var(--line);margin:8px auto 0;border:2.5px solid var(--panel);box-shadow:0 0 0 1.5px var(--line)}
.st.hot .dot{background:var(--gold);box-shadow:0 0 0 1.5px var(--gold)}
.st::after{content:'';position:absolute;top:calc(100% - 13px);left:50%;width:100%;height:1.5px;background:var(--line);z-index:-1}
.st:last-child::after{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px 'Inter',sans-serif;padding:3px 9px;border-radius:99px;white-space:nowrap}
.c-gold{background:var(--gold-soft);color:#8A6A15}.c-green{background:var(--green-soft);color:var(--green)}
.c-red{background:var(--crimson-soft);color:var(--crimson)}.c-blue{background:var(--blue-soft);color:var(--blue)}
.c-gray{background:var(--soft);color:var(--slate)}
.score{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;padding:3px 8px;border-radius:6px}
.s90{background:var(--gold-soft);color:#8A6A15}.s80{background:var(--green-soft);color:var(--green)}
.s70{background:var(--blue-soft);color:var(--blue)}.s0{background:var(--soft);color:var(--slate)}
.item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
.item .t{font-weight:600;font-size:14.5px}.item .m{color:var(--slate);font-size:12.5px;margin-top:2px}
.item .b{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:26px 16px;text-align:center;color:var(--slate);font-size:13px}
button.btn{font:600 13px/1 'Inter',sans-serif;border-radius:9px;padding:0 16px;height:38px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;border:1px solid transparent;letter-spacing:.1px;transition:transform .1s ease,box-shadow .15s ease,background .15s ease;white-space:nowrap}
button.btn:hover{transform:translateY(-1px)}button.btn:active{transform:translateY(0)}
.b-ink{background:var(--ink);color:#fff}.b-ink:hover{background:var(--ink-2);box-shadow:0 3px 10px rgba(27,42,65,.22)}
.b-gold{background:var(--gold);color:#fff}.b-gold:hover{background:#A67F22;box-shadow:0 3px 10px rgba(184,145,46,.28)}
.nav-adv{display:flex;gap:8px;padding:0 4px 6px;flex-wrap:wrap}
nav.nav-adv button.adv{font-size:11px;color:#8A93A4;border:none;background:none;padding:2px 6px;border-bottom:2px solid transparent}
nav.nav-adv button.adv.on{color:var(--ink);border-bottom-color:var(--gold)}
.big-btn{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;padding:17px 20px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;margin-bottom:11px;box-shadow:var(--shadow);transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease}
.big-btn:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:0 4px 16px rgba(27,42,65,.10)}
.big-btn .bwrap{min-width:0}
.big-btn .bt{font-size:15.5px;font-weight:700;color:var(--ink);letter-spacing:-.1px}
.big-btn .bd{font-size:12.5px;color:var(--slate);margin-top:3px;line-height:1.4}
.big-btn .bn{flex:0 0 auto;font-family:'Fraunces',serif;font-size:30px;color:var(--gold);font-weight:700;line-height:1;min-width:34px;text-align:right}
.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.mcard{border:1px solid var(--line);border-radius:14px;padding:17px 19px;margin-bottom:12px;background:var(--panel);box-shadow:var(--shadow)}
.mcard.gold{border-color:var(--gold);background:linear-gradient(160deg,var(--gold-soft),var(--panel) 55%)}
.pct{font-family:'Fraunces',serif;font-size:32px;font-weight:700;color:var(--green);line-height:1}
.sect-title{font-family:'Fraunces',serif;font-size:21px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
.b-line{background:#fff;color:var(--ink);border-color:var(--line)}.b-line:hover{border-color:var(--slate);background:#FAFBFC}
.b-green{background:var(--green);color:#fff}.b-green:hover{background:#1C6149;box-shadow:0 3px 10px rgba(35,116,90,.24)}
.b-red{background:#fff;color:var(--crimson);border-color:var(--crimson-soft)}.b-red:hover{background:var(--crimson-soft)}
.b-sm{height:32px;min-height:32px;padding:0 12px;font-size:12px;border-radius:8px}
.b-lg{height:46px;min-height:46px;padding:0 22px;font-size:14.5px;border-radius:11px}
button:disabled{opacity:.5;cursor:default;transform:none!important}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:block;font:600 12px 'Inter',sans-serif;color:var(--slate);margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:400 14px 'Inter',sans-serif;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
textarea{min-height:80px;resize:vertical}
.auth-wrap{min-height:92vh;display:grid;place-items:center;padding:20px}
.auth{width:100%;max-width:520px}
.auth .logo{font-family:'Fraunces',serif;font-weight:700;font-size:34px;text-align:center;margin-bottom:4px}
.auth .logo .x{color:var(--gold)}
.auth .tag{text-align:center;color:var(--slate);font-size:13px;margin-bottom:22px}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line);font-style:normal}
.steps i.on{background:var(--gold)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font:600 13px 'Inter',sans-serif;box-shadow:var(--shadow);z-index:80;display:none;max-width:88vw;text-align:center}
#ovl{position:fixed;inset:0;background:rgba(27,42,65,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
@media(min-width:640px){#ovl{align-items:center}}
#ovl.open{display:flex}
#modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:680px;max-height:88vh;overflow-y:auto;padding:20px 18px 26px}
@media(min-width:640px){#modal{border-radius:16px}}
#modal h3{font-family:'Fraunces',serif;font-size:19px}
.dl{font-family:'IBM Plex Mono',monospace;font-size:11.5px}
pre.doc{white-space:pre-wrap;font:400 13.5px/1.65 'Inter',sans-serif;background:var(--soft);padding:14px;border-radius:10px;margin-top:10px}
a{color:var(--blue)}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
.checklist .item{padding:10px 14px}
.done{color:var(--green)}
</style>
</head>
<body>
<div id="app"></div>
<div id="ovl" onclick="if(event.target===this)closeModal()"><div id="modal"></div></div>
<div id="toast"></div>
<script>
/* ================= core ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3200)}
function daysLeft(d){if(!d)return null;return Math.ceil((new Date(d+'T23:59:59')-new Date())/86400000)}
function dlChip(d){const n=daysLeft(d);if(n===null)return '<span class="chip c-gray">no deadline</span>';
if(n<0)return '<span class="chip c-gray">expired</span>';
if(n<=7)return `<span class="chip c-red dl">D-${n}</span>`;
if(n<=21)return `<span class="chip c-gold dl">D-${n}</span>`;
return `<span class="chip c-gray dl">D-${n}</span>`}
function scoreChip(n){n=Number(n)||0;const c=n>=90?'s90':n>=80?'s80':n>=70?'s70':'s0';return `<span class="score ${c}">${n} / 100</span>`}
function stChip(s){const map={'VERIFIED':'c-green','NEEDS_VERIFICATION':'c-gold','EXPIRED':'c-gray','SENT':'c-blue','PENDING':'c-gold','APPROVED':'c-blue','REJECTED':'c-gray','NO_EMAIL':'c-red'};return `<span class="chip ${map[s]||'c-gray'}">${esc((s||'NEW').replace(/_/g,' ').toLowerCase())}</span>`}
function closeModal(){$('ovl').classList.remove('open')}
function modal(html){$('modal').innerHTML=html;$('ovl').classList.add('open')}

const CATS=[['international_job','International (Postdoc priority)'],['national_job','National Jobs'],['remote_job','Remote Jobs']];
const catLabel=c=>((CATS.find(x=>x[0]===c)||[])[1])||'International Jobs';
const oppCat=o=>o.category||'international_job';
let TOKEN=localStorage.getItem('pdx_token')||'';
let ME=null, B=null, TAB='home';

async function api(path,opts={}){
  const headers=opts.headers||{};
  if(TOKEN)headers['Authorization']='Bearer '+TOKEN;
  if(opts.body&&!(opts.body instanceof FormData))headers['Content-Type']='application/json';
  const res=await fetch(path,{...opts,headers,body:opts.body instanceof FormData?opts.body:(opts.body?JSON.stringify(opts.body):undefined)});
  const data=await res.json().catch(()=>({}));
  if(res.status===401){TOKEN='';localStorage.removeItem('pdx_token');renderAuth();throw new Error(data.error||'Signed out')}
  if(!res.ok)throw new Error(data.error||('Error '+res.status));
  return data;
}

/* ================= auth screens ================= */
const REG={};
function renderAuth(mode){
  document.querySelector('#app').innerHTML=`<div class="auth-wrap"><div class="auth">
  <div class="logo">PostDoc<span class="x">X</span></div>
  <div class="tag">Your academic career office. It searches, verifies and writes while you sleep.</div>
  <div class="card" id="authCard"></div></div></div>`;
  if(mode==='reg')regStep();else loginForm();
}
function loginForm(){
  $('authCard').innerHTML=`<h2>Sign in</h2><div class="sub">Welcome back</div>
  <label>Email</label><input id="li-email" type="email" autocomplete="email">
  <label>Password</label><input id="li-pass" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:16px"><button class="btn b-ink" style="flex:1" onclick="doLogin()">Sign in</button></div>
  <div class="sub" style="margin-top:14px;text-align:center">New researcher? <a href="#" onclick="regStep();return false">Create your account</a></div>`;
  $('li-pass').onkeydown=e=>{if(e.key==='Enter')doLogin()};
}
async function doLogin(){
  try{const d=await api('/api/login',{method:'POST',body:{email:$('li-email').value.trim(),password:$('li-pass').value}});
  TOKEN=d.token;localStorage.setItem('pdx_token',TOKEN);ME=d.user;boot();}catch(e){toast(e.message)}
}
function regStep(){
  $('authCard').innerHTML=`<h2>Create your account</h2><div class="sub">Just the basics. Everything else fills itself from your CV after you upload it.</div>
  <label>Full name (as used on publications)</label><input id="r-name" value="${esc(REG.name||'')}">
  <label>Email</label><input id="r-email" type="email" value="${esc(REG.email||'')}">
  <label>Password (8+ characters)</label><input id="r-pass" type="password">
  <label>Phone (optional)</label><input id="r-phone" value="${esc(REG.phone||'')}">
  <label>What opportunities are you interested in? (choose one or more)</label>
  ${CATS.map(([k,l])=>`<div class="row" style="margin:4px 0"><input type="checkbox" id="jp-${k}" style="width:auto" ${k==='international_job'?'checked':''}><span>${l}</span></div>`).join('')}
  <div class="row" style="margin-top:16px"><button class="btn b-ink" style="flex:1" onclick="regSave()">Create account</button></div>
  <div class="sub" style="margin-top:14px;text-align:center">Already registered? <a href="#" onclick="loginForm();return false">Sign in</a></div>`;
}
function regSave(){
  REG.name=$('r-name').value.trim();REG.email=$('r-email').value.trim();REG.password=$('r-pass').value;REG.phone=$('r-phone').value.trim();
  if(!REG.name||!REG.email||!REG.password)return toast('Name, email and password are required');
  if(REG.password.length<8)return toast('Password must be at least 8 characters');
  REG.jobPrefs=CATS.filter(([k])=>$('jp-'+k).checked).map(([k])=>k);
  if(!REG.jobPrefs.length)return toast('Pick at least one opportunity type');
  api('/api/register',{method:'POST',body:REG}).then(d=>{
    TOKEN=d.token;localStorage.setItem('pdx_token',TOKEN);ME=d.user;
    toast('Welcome, '+ME.name.split(' ')[0]+'. Now upload your CV and watch the profile fill itself.');boot('onboard');
  }).catch(e=>toast(e.message));
}

/* ================= app shell ================= */
const TABS=[['home','Home'],['matches','Best matches'],['apps','Applications'],['action','Action needed'],['mydocs','My documents'],['activity2','Activity']];
const ADV_TABS=[['postdoc','Postdoc engine'],['jobs','Job search'],['profile','Profile & settings']];
function shell(){
  const isAdmin=ME&&ME.role==='admin';
  const tabs=[...TABS];
  document.querySelector('#app').innerHTML=`<header><div class="brand-row">
  <div class="brand"><h1>PostDoc<span class="x">X</span></h1></div>
  <div style="text-align:right"><div class="uname">${esc(ME.name)}${isAdmin?' · admin':''}</div>
  <a href="#" style="color:#9FB0C3;font-size:11.5px" onclick="logout();return false">Sign out</a></div></div>
  <nav>${tabs.map(([id,l])=>`<button id="nb-${id}" onclick="go('${id}')">${l}</button>`).join('')}</nav>
  <nav class="nav-adv">${[...ADV_TABS,...(isAdmin?[['admin','Admin']]:[])].map(([id,l])=>`<button id="nb-${id}" onclick="go('${id}')" class="adv">${l}</button>`).join('')}</nav></header>
  <main id="view"></main>`;
}
function logout(){TOKEN='';localStorage.removeItem('pdx_token');ME=null;B=null;renderAuth()}
function go(t){TAB=t;render()}
async function boot(first){
  if(!TOKEN)return renderAuth();
  try{
    if(!ME)ME=(await api('/api/me')).user;
    shell();
    if(first==='onboard'){TAB='mydocs';}
    await refresh();
  }catch(e){/* auth handler already redirected */}
}
async function refresh(){
  try{B=await api('/api/bundle');ME=B.me;}catch(e){}
  startLive();
  render();
  // FEATURE 3: trigger a fresh search shortly after login (throttled server-side)
  if(!window._autoRan){window._autoRan=true;setTimeout(async()=>{
    try{const d=await api('/api/auto-refresh',{method:'POST'});if(d.ran){toast('Searching for new opportunities…');let n=0;const t=setInterval(async()=>{n++;await loadHome();if(['home','matches','jobs'].includes(TAB))render();if(n>=5)clearInterval(t)},25000);}}catch(e){}
  },4000);}
}
function render(){
  if(!ME)return;
  [...TABS,...ADV_TABS,['admin','Admin']].forEach(([id])=>{const b=$('nb-'+id);if(b)b.className=(id===TAB?'on':'')+(ADV_TABS.some(a=>a[0]===id)?' adv':'')});
  const V={home:vHome,matches:vMatches,apps:vApps,action:vAction,mydocs:vMyDocs,activity2:vActivitySimple,more:vMore,postdoc:vPostdoc,jobs:vJobs,profile:vProfilePage,dash:vHome,activity:vActivity,cases:vPostdoc,opps:vPostdoc,couple:vPostdoc,outbox:vActivity,docs:vProfilePage,refs:vProfilePage,props:vActivity,admin:vAdmin};
  (V[TAB]||vDash)();
}

/* ================= onboarding checklist ================= */
const REQUIRED_DOCS=['CV','Research statement','Degree certificates','Transcripts','Publication PDFs','Passport / ID'];
let DOCS=[],REFS=[];
function checklist(){
  const have=new Set(DOCS.map(d=>d.type));
  const items=[
    ...REQUIRED_DOCS.map(t=>({ok:have.has(t),label:t+' uploaded',tab:'profile'})),
    {ok:!!(ME.field&&ME.methods&&ME.pubs),label:DOCS.length?'Profile extracted, review it once':'Profile (fills itself from your CV upload)',tab:'profile'},
    {ok:ME.emailConnected,label:'Your Gmail connected',tab:'profile'},
    {ok:REFS.length>=2,label:'At least two referees added (you can add more)',tab:'profile'}
  ];
  const done=items.filter(i=>i.ok).length;
  return {items,done,total:items.length,pct:Math.round(100*done/items.length)};
}

/* ================= views ================= */

/* ================= SIMPLE MODE ================= */

async function vMore(){
  $('view').innerHTML='<div class="empty">Loading more opportunities…</div>';
  let d;try{d=await api('/api/below-threshold')}catch(e){$('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>';return}
  $('view').innerHTML=`<div class="mcard" style="border:none;background:none;padding:0 2px 8px">
  <div class="sect-title">More possible opportunities</div>
  <div class="sub">These scored below your ${d.threshold}% bar, so the agent did not auto-engage. Review and pursue any that interest you.</div></div>
  ${d.items.length?d.items.map(o=>`<div class="mcard">
  <div style="display:flex;justify-content:space-between"><div style="min-width:0">
  <div style="font-weight:700;color:var(--ink)">${esc(o.institution||'')}</div>
  <div style="font-size:13px;margin-top:2px">${esc(o.title||'')}</div></div>
  <div style="text-align:right;flex:0 0 auto"><div class="pct" style="color:var(--slate)">${parseInt(o.matchScore)||0}<span style="font-size:16px">%</span></div><div class="sub" style="margin:0;font-size:10px;text-transform:uppercase">match</div></div></div>
  <div class="sub" style="margin-top:8px">${esc((o.note||'').split('|')[0]||'')}</div>
  <div class="btn-group" style="margin-top:12px"><button class="btn b-gold" onclick="pursue('${o.id}')">Pursue this</button>
  ${o.url?`<a class="btn b-line" href="${esc(o.url)}" target="_blank" rel="noopener">View posting</a>`:''}</div></div>`).join(''):'<div class="empty">Nothing below the bar right now.</div>'}`;
}
async function pursue(oppId){
  toast('Pursuing: reading requirements and preparing the full case…');
  try{const d=await api('/api/opps/'+oppId+'/pursue',{method:'POST'});toast(d.message);setTimeout(()=>openCase(oppId),3500);}catch(e){toast(e.message)}
}


let SEND_HEALTH=null;
async function openCase(oppId){
  toast('Opening the full case…');
  try{
    const [d,h]=await Promise.all([api('/api/case/'+oppId),api('/api/send-health').catch(()=>({canSend:false,note:'unknown'}))]);
    SEND_HEALTH=h;
    const o=d.opportunity;
    const email=(d.emails||[]).find(m=>m.status==='PENDING'||m.status==='APPROVED')||(d.emails||[])[0];
    const verified=o.status==='VERIFIED';
    const recip=email?email.toEmail:'';
    modal(`<div style="max-height:78vh;overflow:auto">
    <h3 style="margin-right:30px">${esc(o.institution||'')}</h3>
    <div class="sub">${esc(o.title||'')}${o.pi?' · '+esc(o.pi):''}${o.country?' · '+esc(o.country):''}</div>
    <div class="row" style="margin:8px 0 4px">
    ${o.matchScore?`<span class="chip c-green">${o.matchScore}% match</span>`:''}
    <span class="chip ${verified?'c-green':'c-gray'}">${verified?'✓ Verified against source':'Verification pending'}</span>

  let d;try{d=await api('/api/case-history/'+oppId)}catch(e){toast(e.message);return}
  const o=d.opportunity;const kindIcon={found:'○',verified:'✓',analyzed:'✓',draft:'✎',sent:'→',reply:'✉'};
  const kindColor={sent:'var(--blue)',reply:'var(--green)',verified:'var(--green)',analyzed:'var(--green)',draft:'var(--slate)',found:'var(--slate)'};
  modal(`<div style="max-height:80vh;overflow:auto">
  <h3 style="margin-right:30px">${esc(o.institution||'')}</h3>
  <div class="sub">${esc(o.title||'')}${o.pi?' · '+esc(o.pi):''}</div>
  <div class="row" style="margin:8px 0">
  ${d.case?`<span class="chip" style="background:${statusColor(d.case.stage)}1A;color:${statusColor(d.case.stage)}">${esc(d.case.stage)}</span>`:''}
  ${o.matchScore?`<span class="chip c-green">${o.matchScore}% match</span>`:''}
  ${d.case&&d.case.caseNo?`<span class="chip c-gray">${esc(d.case.caseNo)}</span>`:''}</div>

  <div style="margin-top:14px;font-weight:700;font-size:13px;color:var(--ink)">History</div>
  <div style="margin-top:8px;border-left:2px solid var(--line);padding-left:14px">
  ${d.timeline.length?d.timeline.map(ev=>`<div style="position:relative;margin-bottom:12px">
  <span style="position:absolute;left:-21px;color:${kindColor[ev.kind]||'var(--slate)'};font-weight:700">${kindIcon[ev.kind]||'•'}</span>
  <div style="font-size:12.5px;color:var(--ink)">${esc(ev.text)}</div>
  <div class="sub" style="font-size:11px">${ev.on?esc(ev.on):''}</div>
  ${ev.body&&(ev.kind==='reply'||ev.kind==='sent')?`<div class="sub" style="margin-top:4px;padding:8px;background:var(--soft);border-radius:8px;white-space:pre-wrap;font-size:12px">${esc((ev.body||'').slice(0,600))}</div>`:''}</div>`).join(''):'<div class="sub">No events yet.</div>'}
  </div>

  ${d.attachments&&d.attachments.length?`<div style="margin-top:14px;font-weight:700;font-size:13px;color:var(--ink)">Prepared documents</div>
  ${d.attachments.map(a=>`<div class="sub">📎 ${esc(a.name)}</div>`).join('')}`:''}

  ${d.replies&&d.replies.length?`<div style="margin-top:14px;font-weight:700;font-size:13px;color:var(--ink)">Latest reply</div>
  <div class="sub" style="white-space:pre-wrap">${esc((d.replies[d.replies.length-1].body||'').slice(0,800))}</div>`:''}

  <div class="btn-group" style="margin-top:16px;position:sticky;bottom:0;background:var(--panel);padding-top:10px">
  <button class="btn b-line" onclick="closeModal();openCase('${oppId}')">Open case actions</button>
  <button class="btn b-line" onclick="closeModal()">Close</button></div></div>`);
}

function pendingN(out){return out.filter(m=>m.status==='PENDING').length}
function vDash(){
  const o=B?B.opportunities:[],out=B?B.outbox:[];
  const verified=o.filter(x=>x.status==='VERIFIED'),high=o.filter(x=>(+x.matchScore||0)>=65&&x.status!=='EXPIRED');
  const sent=out.filter(m=>m.status==='SENT'),replied=out.filter(m=>m.replied==='yes'),pending=out.filter(m=>m.status==='PENDING');
  const cases=B&&B.cases?B.cases:[];
  const readyCases=cases.filter(c=>c.stage==='Email prepared'||c.stage==='Awaiting approval');
  const activeCases=cases.filter(c=>c.status==='ACTIVE');
  const coupleN=o.filter(x=>x.coupleKey).length;
  const rail=[['Discover',o.length],['Verify',verified.length],['Cases',activeCases.length],['Ready',readyCases.length+pendingN(out)],['Sent',sent.length],['Replies',replied.length],['Couple',coupleN]];
  const dls=o.filter(x=>x.deadline&&daysLeft(x.deadline)>=0).sort((a,b)=>a.deadline<b.deadline?-1:1).slice(0,6);
  const cl=checklist();
  $('view').innerHTML=`
  ${cl.pct<100?`<div class="card" style="padding:12px 16px"><div class="spread"><div class="m">Setup ${cl.pct}% done. Everything happens in one place: upload documents and the rest fills itself.</div>
  <button class="btn b-gold b-sm" onclick="go('profile')">Open Profile</button></div></div>`:''}
  <div class="card"><div class="spread"><div><h2>Your pipeline</h2><div class="sub">${B&&B.partner?'Couple-linked with '+esc(B.partner.name)+' · ':''}The agent runs every morning and evening</div></div></div>
  <div class="rail">${rail.map(([l,n])=>`<div class="st ${n>0?'hot':''}"><div class="n">${n}</div><div class="l">${l}</div><div class="dot"></div></div>`).join('')}</div>
  <div class="b" style="margin-top:10px">${(ME.jobPrefs||'international_job').split(',').filter(Boolean).map(k=>`<span class="chip c-gray" style="cursor:pointer" onclick="if('${k}'==='international_job'){go('postdoc')}else{JOBFILTER='${k}';go('jobs')}">${catLabel(k)}: <b class="mono">&nbsp;${o.filter(x=>oppCat(x)===k).length}</b></span>`).join('')}</div></div>
  ${pending.length?`<div class="card"><h2>Waiting for your approval</h2><div class="sub">These emails will not send until you approve them</div>
  ${pending.slice(0,3).map(outRow).join('')}
  ${pending.length>3?`<button class="btn b-line b-sm" onclick="go('outbox')">See all ${pending.length}</button>`:''}</div>`:''}
  <div class="grid2">
  <div class="card"><h2>Upcoming deadlines</h2><div class="sub">Back-planned from D-21</div>
  ${dls.length?dls.map(x=>`<div class="item spread"><div><div class="t">${esc(x.title)}</div><div class="m">${esc(x.institution)}</div></div>${dlChip(x.deadline)}</div>`).join(''):'<div class="empty">No live deadlines yet. New finds arrive with the morning cycle.</div>'}</div>
  <div class="card"><h2>Top matches</h2><div class="sub">Score 80+, strong or exceptional fit</div>
  ${high.length?high.sort((a,b)=>(+b.matchScore)-(+a.matchScore)).slice(0,4).map(oppRow).join(''):'<div class="empty">Nothing scored 65+ yet.</div>'}</div>
  </div>`;
  loadSide();
}

const CASE_STAGES=['Discovered','Verified','Email prepared','Awaiting approval','Sent','Replied','In conversation','Interview','Closed'];
function vCases(host){
  const cases=(B&&B.cases?B.cases:[]).sort((a,b)=>(b.updatedOn||'')<(a.updatedOn||'')?-1:1);
  const opps=B?B.opportunities:[];
  const threads=B&&B.threads?B.threads:[];
  (host||$('view')).innerHTML=`<div class="card"><div class="spread"><div><h2>Cases</h2>
  <div class="sub">Every strong verified match becomes a case automatically and moves through the pipeline. You only step in where the timeline says so.</div></div>
  <div class="row"><button class="btn b-line b-sm" onclick="refresh().then(()=>toast('Up to date'))">Check for updates</button>
  ${ME.role==='admin'?`<button class="btn b-gold b-sm" onclick="adminRun()">Run agent now</button>`:''}</div></div>
  ${cases.length?cases.map(c=>{
    const o=opps.find(x=>x.id===c.oppId)||{};
    const idx=Math.max(0,CASE_STAGES.indexOf(c.stage));
    const th=threads.filter(t=>t.oppId===c.oppId);
    return `<div class="item">
    <div class="spread"><div style="min-width:0"><div class="t"><span class="mono" style="color:var(--gold)">${esc(c.caseNo)}</span> ${esc(o.title||'')}</div>
    <div class="m">${esc(o.institution||'')}${o.pi?' · PI: '+esc(o.pi):''}${o.country?' · '+esc(o.country):''}</div></div>
    ${scoreChip(c.matchScore)}</div>
    <div class="rail" style="margin-top:8px">${CASE_STAGES.map((st,i)=>`<div class="st ${i<=idx?'hot':''}" style="min-width:72px"><div class="l" style="margin-top:0">${st}</div><div class="dot"></div></div>`).join('')}</div>
    ${c.nextAction?`<div class="m" style="margin-top:8px"><b>Next:</b> ${esc(c.nextAction)}</div>`:''}
    ${c.outcome?`<div class="m" style="margin-top:4px;color:var(--crimson)">Outcome: ${esc(c.outcome)}</div>`:''}
    ${th.length?`<div class="m" style="margin-top:6px"><b>Latest from supervisor</b> (${esc(th[th.length-1].intent||'')}): ${esc((th[th.length-1].body||'').slice(0,180))}…</div>`:''}
    <div class="b">
    ${o.deadline?dlChip(o.deadline):''}
    ${(c.stage==='Email prepared'||c.stage==='Awaiting approval')?`<button class="btn b-green b-sm" onclick="authorizeOpp('${c.oppId}')">Authorize and submit</button>`:''}
    <button class="btn b-line b-sm" onclick="gen('cv','${c.oppId}')">Tailored CV</button>
    <button class="btn b-line b-sm" onclick="gen('proposal','${c.oppId}')">Concept note</button>
    <button class="btn b-line b-sm" onclick="gen('interview','${c.oppId}')">Interview brief</button>
    ${c.coupleKey?`<button class="btn b-line b-sm" onclick="gen('dossier','${c.oppId}')">Two-body dossier</button>`:''}
    ${o.url?`<a href="${esc(o.url)}" target="_blank" rel="noopener" class="chip c-blue">source ↗</a>`:''}
    </div></div>`}).join(''):`<div class="empty">No cases yet. Cases open automatically when the agent finds AND verifies a match scoring 65+, which happens during the morning and evening cycles.${ME.role==='admin'?' Tap Run agent now to start a cycle immediately, the first one takes about 2 to 3 minutes.':''}</div>`}</div>`;
}


const isPostdoc=o=>(o.section||'postdoc')==='postdoc';
let PD_SEG='pipeline';
function vPostdoc(){
  const out=B?B.outbox:[],cases=B&&B.cases?B.cases:[];
  const pd=(B?B.opportunities:[]).filter(isPostdoc);
  const contacted=out.filter(m=>m.type==='outreach'&&m.status==='SENT').length;
  const replies=out.filter(m=>m.replied==='yes').length;
  const interviews=cases.filter(c=>c.stage==='Interview').length;
  const verified=pd.filter(o=>o.status==='VERIFIED').length;
  $('view').innerHTML=`<div class="card" style="padding:12px 16px"><div class="spread">
  <div class="row" style="gap:16px">
  <div class="stat"><b>${pd.length}</b><span>found</span></div>
  <div class="stat"><b>${verified}</b><span>verified</span></div>
  <div class="stat"><b>${contacted}</b><span>supervisors contacted</span></div>
  <div class="stat"><b>${replies}</b><span>replies</span></div>
  <div class="stat"><b>${interviews}</b><span>interviews</span></div></div>
  <div class="row"><button class="btn ${PD_SEG==='pipeline'?'b-ink':'b-line'} b-sm" onclick="PD_SEG='pipeline';render()">Pipeline</button>
  <button class="btn ${PD_SEG==='cases'?'b-ink':'b-line'} b-sm" onclick="PD_SEG='cases';render()">Cases</button>
  <button class="btn ${PD_SEG==='couple'?'b-ink':'b-line'} b-sm" onclick="PD_SEG='couple';render()">Couple</button></div></div></div>
  <div id="pdseg"></div>`;
  const host=$('pdseg');
  if(PD_SEG==='cases')vCases(host);
  else if(PD_SEG==='couple')vCouple(host);
  else{
    const o=pd.sort((a,b)=>{const ca=a.coupleKey?1:0,cb=b.coupleKey?1:0;if(cb-ca)return cb-ca;return (+b.matchScore||0)-(+a.matchScore||0)});
    host.innerHTML=`<div class="card"><div class="spread"><div><h2>Postdoc pipeline</h2>
    <div class="sub">The core engine: 5 verified searches per researcher per day, its own schedule, never shared with the Jobs section.</div></div>
    <div class="row">${ME.role==='admin'?`<button class="btn b-gold" onclick="adminRun()">Run agent now</button>`:''}
    <button class="btn b-line" onclick="labMap()">Build target lab map</button></div></div>
    ${o.length?o.map(oppRow).join(''):'<div class="empty">The engine has not run since deploy. Tap Run agent now, verified postdoctoral opportunities arrive within a few minutes.</div>'}</div>`;
  }
}

function vOpps(host){

  ${o.length?o.map(oppRow).join(''):'<div class="empty">The postdoc engine has not run since this deploy. Open Cases and tap Run agent now, verified postdoctoral opportunities will appear here under International within a few minutes. Morning and evening cycles then continue automatically.</div>'}</div>`;

function vCouple(host){
  const mine=(B?B.opportunities:[]).filter(o=>o.coupleKey);
  const theirs=B?B.coupleOpportunities:[];
  const groups={};
  [...mine,...theirs].forEach(o=>{(groups[o.coupleKey]=groups[o.coupleKey]||[]).push(o)});
  const keys=Object.keys(groups);
  (host||$('view')).innerHTML=`<div class="card"><h2>Couple placement</h2>
  <div class="sub">${B&&B.partner?'Scenarios where you and '+esc(B.partner.name)+' can be placed together: same university, same city, or one funded role plus one hostable route nearby.':'Ask the admin to link your accounts as a couple, then scenarios appear here.'}</div>
  ${keys.length?keys.map(k=>`<div class="item"><div class="t" style="margin-bottom:6px">Scenario: ${esc(k.split('-').pop())}</div>
  ${groups[k].map(o=>`<div class="m" style="margin:6px 0 2px"><b>${o.resId===ME.id?'You':'Partner'}:</b> ${esc(o.title)}, ${esc(o.institution)} ${scoreChip(o.matchScore)} ${stChip(o.status)}</div>`).join('')}
  <div class="b">${groups[k].filter(o=>o.resId===ME.id).map(o=>`<button class="btn b-line b-sm" onclick="gen('dossier','${o.id}')">Generate two-body dossier</button>`).join('')}</div>
  </div>`).join(''):'<div class="empty">No couple scenarios yet. They are searched every morning when both partners are linked.</div>'}</div>`;
}
function outRow(m){
  const th=(B&&B.threads?B.threads:[]).filter(t=>t.outboxId===m.id||((m.type==='reply')&&t.oppId===m.oppId));
  const lastTh=th[th.length-1];
  return `<div class="item">${m.type==='reply'&&lastTh?`<div class="m" style="margin-bottom:8px;padding:9px 11px;background:var(--soft);border-radius:8px"><b>${esc(lastTh.fromEmail)} wrote</b> (${esc(lastTh.intent||'')}): ${esc((lastTh.body||'').slice(0,300))}${(lastTh.body||'').length>300?'…':''}</div>`:''}
  <div class="spread"><div style="min-width:0"><div class="t">${esc(m.subject)}</div>

  <button class="btn ${(B&&B.mode)!=='auto'?'b-ink':'b-line'}" onclick="setMode('approval')">Copilot (you approve each send)</button>
  <button class="btn ${(B&&B.mode)==='auto'?'b-gold':'b-line'}" onclick="setMode('auto')">Autopilot (sends itself)</button>
  </div></div>
  <div id="diagBox"></div>
  <div class="card"><h2>Backups</h2>
  <div class="sub">Weekly automatic, last 8 kept. Restore only fills EMPTY tabs, nothing can be overwritten.</div>
  <div class="b"><button class="btn b-line b-sm" onclick="listBackups()">Show backups</button></div>
  <div id="bkBox"></div></div>
  ${users.map(u=>`<div class="item spread"><div><div class="t">${esc(u.name)} ${u.role==='admin'?'<span class="chip c-gold">admin</span>':''}</div>
  <div class="m">${esc(u.email)} · ${u.emailConnected?'email connected ✓':'email not connected'}${u.partnerId?' · couple-linked':''}</div></div></div>`).join('')}
  <hr class="sep"><b style="font-size:13px">Link a couple</b>
  <div class="sub">Both pipelines then also search for co-located placements every morning</div>
  <label>Researcher A</label><select id="cp-a">${users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
  <label>Researcher B</label><select id="cp-b">${users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
  <div class="b" style="margin-top:12px"><button class="btn b-ink" onclick="linkCouple()">Link as couple</button>
  <button class="btn b-line" onclick="unlinkCouple()">Unlink A</button></div></div>`;
  }).catch(e=>toast(e.message));
}

async function listBackups(){
  const box=$('bkBox');box.innerHTML='<div class="empty">Loading…</div>';
  try{
    const d=await api('/api/admin/backups');
    box.innerHTML=d.backups.length?d.backups.map(b=>`<div class="item spread"><div class="t" style="font-size:13px">${esc(b.name)}</div>
    <button class="btn b-line b-sm" onclick="restoreFrom('${b.id}')">Restore a tab</button></div>`).join(''):'<div class="empty">No backups yet. They run every Sunday, or tap Back up Sheet now.</div>';
  }catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
function restoreFrom(id){
  modal(`<h3>Restore from backup</h3><div class="sub">Pick which tab to restore. Only EMPTY tabs can be filled, so this can never overwrite live data.</div>
  <label>Tab</label><select id="rst-tab">${['Users','Opportunities','Outbox','Proposals','Referees','Documents','Cases','Threads','Tasks'].map(t=>`<option>${t}</option>`).join('')}</select>
  <div class="b" style="margin-top:14px"><button class="btn b-ink" onclick="doRestore('${id}')">Restore this tab</button>
  <button class="btn b-line" onclick="closeModal()">Cancel</button></div>`);
}
async function doRestore(id){
  try{const d=await api('/api/admin/restore',{method:'POST',body:{id,tab:$('rst-tab').value}});toast(d.message);closeModal()}catch(e){toast(e.message)}
}
async function setMode(m){
  try{const d=await api('/api/admin/mode',{method:'POST',body:{mode:m}});toast(d.message);await refresh()}catch(e){toast(e.message)}
}
async function healthPanel(){
  const box=$('healthBox');box.innerHTML='<div class="empty">Checking every internal system…</div>';
  try{
    const d=await api('/api/admin/autopilot-health');
    const row=(label,r)=>`<div class="item spread"><div><div class="t">${label}</div><div class="m">${esc((r&&r.note)||'')}</div></div><span class="chip ${r&&r.ok?'c-green':'c-red'}">${r&&r.ok?'OK':'CHECK'}</span></div>`;
    box.innerHTML='<div class="card"><h2>Autopilot health</h2>'+
      row('Database',d.database)+row('Document storage',d.storage)+row('Email sending',d.email)+
      row('AI engines',d.ai)+row('Last cycle',d.lastCycle)+row('Autopilot',d.autopilot)+
      row('Pipeline',d.pipeline)+row('Tasks',d.tasks)+'</div>';
  }catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
async function backup(){try{const d=await api('/api/admin/backup',{method:'POST'});toast(d.message)}catch(e){toast(e.message)}}
async function diag(){
  const box=$('diagBox');box.innerHTML='<div class="empty">Running checks against Google Sheets, Drive, Gmail and the Claude API…</div>';
  try{
    const d=await api('/api/admin/diag');
    const row=(label,r)=>`<div class="item spread"><div><div class="t">${label}</div><div class="m">${esc(r.note||'')}</div></div><span class="chip ${r.ok?'c-green':'c-red'}">${r.ok?'OK':'FIX'}</span></div>`;
    const ks=d.drive&&d.drive.keyShape?d.drive.keyShape:null;
    box.innerHTML=row('Google Sheets (database)',d.sheets)
      +(d.storage?row('Document storage',d.storage):'')
      +(ks?row('Drive credentials shape',{ok:ks.keyPresent&&ks.hasBeginMarker&&ks.hasEndMarker&&ks.keyParses&&!String(ks.serviceEmail).startsWith('('),
        note:'Project: '+ks.projectId+' · Email: '+ks.serviceEmail+' · Key present: '+ks.keyPresent+' · BEGIN/END markers: '+(ks.hasBeginMarker&&ks.hasEndMarker)+' · Escaped \\n: '+ks.hadEscapedNewlines+' · Surrounding quotes: '+ks.hadSurroundingQuotes+' · Key parses: '+ks.keyParses}):'')
      +(d.drive&&d.drive.token?row('Drive authentication (token)',d.drive.token):'')
      +(d.drive&&d.drive.api?row('Drive API enabled',d.drive.api):'')
      +(d.drive&&d.drive.folder?row('PostDocX folder access',d.drive.folder):'')
      +row('Office Gmail',d.gmail)
      +row('Claude API key',d.anthropic);
  }catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
async function linkCouple(){try{await api('/api/admin/link-couple',{method:'POST',body:{a:$('cp-a').value,b:$('cp-b').value}});toast('Couple linked, co-location search starts next cycle');vAdmin()}catch(e){toast(e.message)}}
async function unlinkCouple(){try{await api('/api/admin/unlink-couple',{method:'POST',body:{a:$('cp-a').value}});toast('Unlinked');vAdmin()}catch(e){toast(e.message)}}
async function adminRun(){try{const d=await api('/api/admin/run',{method:'POST'});toast(d.message)}catch(e){toast(e.message)}}
async function adminWeekly(){try{const d=await api('/api/admin/weekly',{method:'POST'});toast(d.message)}catch(e){toast(e.message)}}

/* ================= start ================= */
if(TOKEN)boot();else renderAuth();
</script>
</body>
</html>
