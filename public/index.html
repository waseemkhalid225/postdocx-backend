<style>
:root{--ink:#0F2748;--gold:#2563EB;--gold-soft:#EAF1FE;--green:#0E7C66;--green-soft:#E6F5F1;--crimson:#C2415A; --crimson-soft:#FBEAEE;
--blue:#2563EB;--blue-soft:#EAF1FE;--slate:#5A6B82;--line:#E3E9F2;--soft:#F4F8FD;--panel:#FFFFFF;--bg:#F7FAFE}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
/* ===== Full-screen 3D world layers ===== */
#worldBg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 60% 40%,#0e2a55 0%,#071630 55%,#040d1f 100%);opacity:0;transition:opacity .8s}
#worldBg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#worldBg.on{opacity:1}
#worldBg canvas{display:block}
#worldOverlay{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(4,13,31,.28),rgba(4,13,31,.44));opacity:0;transition:opacity .8s}
#worldOverlay.on{opacity:1}
body.world-on header{position:relative;z-index:3;background:rgba(8,20,44,.72);backdrop-filter:blur(10px);border-bottom:1px solid rgba(120,160,255,.18)}
body.world-on header .brand{color:#fff}
body.world-on #nav button{color:#cfe1ff}
body.world-on #nav button.on{color:#fff}
body.world-on main#view{position:relative;z-index:2}
/* let the globe receive drags only where the page opts in */
#worldBg.interactive{pointer-events:auto}
/* the world is the page: dark base everywhere, content floats transparent above it */
body.world-on{background:#040d1f;overflow-x:hidden}
html:has(body.world-on){background:#040d1f}
body.world-on main#view{background:transparent}
body.world-on .brand b,body.world-on .auth-brand-lg b{color:#1683FF}
body.world-on .credit-pill{background:linear-gradient(135deg,#1683FF,#00D4FF);color:#14213D}
h1,h2,h3,.brand{font-family:Fraunces,serif}
.brand{font-size:22px;font-weight:700}.brand b{color:var(--gold)}
header{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:0 1px 0 rgba(15,39,72,.06)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:none;color:#C9D2DE;padding:8px 12px;border-radius:8px;font:600 13px Inter;cursor:pointer}
nav button.on{color:#fff;border-bottom:2px solid var(--gold);border-radius:0}
main{max-width:920px;margin:0 auto;padding:18px 14px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sub{color:var(--slate);font-size:12.5px}
label{display:block;font:600 12px Inter;color:var(--slate);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:14px Inter;background:#fff}
textarea{min-height:90px}
.btn{border:none;border-radius:10px;padding:10px 16px;font:600 13.5px Inter;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.b-ink{background:var(--ink);color:#fff}.b-gold{background:var(--gold);color:#fff}.b-green{background:var(--green);color:#fff}
.b-line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.provrow{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--slate)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:99px;font:600 11px/1 Inter;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.c-green{background:var(--green-soft);color:var(--green)}.c-gold{background:var(--gold-soft);color:#1D4FB8}
.c-gray{background:var(--soft);color:var(--slate)}.c-red{background:var(--crimson-soft);color:var(--crimson)}.c-blue{background:var(--blue-soft);color:var(--blue)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--slate);font-size:13px;background:#FDFCFA}
.credit-pill{background:var(--gold);color:#fff;border-radius:99px;padding:6px 14px;font:700 13px Inter;margin-left:auto;cursor:pointer}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;max-width:92vw;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.hero{background:var(--ink);border-radius:16px;color:#fff;padding:26px 22px;margin-bottom:16px}
.hero h1{font-size:26px}.hero p{color:#C9D2DE;margin-top:8px;font-size:13.5px;line-height:1.55}
.pack{border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:center;flex:1;min-width:140px;cursor:pointer}
.pack:hover{border-color:var(--gold)}.pack b{font-size:24px;font-family:Fraunces}
.lane{flex:1;min-width:240px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.lane:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(20,33,61,.10)}
.lane-study:hover{border-color:var(--gold)}.lane-work:hover{border-color:var(--green)}
.lane-ic{font-size:30px;line-height:1;margin-bottom:8px}
.lane h2{font-size:20px;margin-bottom:6px}
.seg{gap:6px}
.segbtn{border:1px solid var(--line);background:#fff;color:var(--slate);border-radius:99px;padding:6px 12px;font:600 12.5px Inter;cursor:pointer}
.segbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.checkrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.checkrow:last-child{border-bottom:none}
.checkbox{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.checkbox.on{background:var(--green);border-color:var(--green);color:#fff}
.checkbox.req{border-color:var(--gold)}
.progwrap{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0}
.progbar{height:100%;background:var(--green);border-radius:99px;transition:width .3s}
@media(max-width:640px){main{padding:12px 10px 84px}.lane{min-width:100%}
/* Bottom navigation, thumb-friendly */
#nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;display:flex!important;justify-content:space-around;background:rgba(6,14,32,.92);backdrop-filter:blur(10px);border-top:1px solid rgba(150,186,255,.25);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
#nav button{font-size:13px;padding:8px 10px;min-height:42px}
header #nav{position:fixed}
/* Modals become bottom sheets */
.sheet{width:100%;max-width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
div[style*="position:fixed"]>div[style*="max-width"]{max-width:100%!important;border-radius:18px 18px 0 0!important}
/* Filter chips scroll horizontally instead of tall wrap */
.row.seg{flex-wrap:nowrap!important;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.segbtn{white-space:nowrap;min-height:38px}
/* Detail table scrolls, never overflows the screen */
table{display:block;overflow-x:auto;white-space:nowrap}
/* Bigger tap targets */
.btn{min-height:42px}
input,select{min-height:42px;font-size:16px}
.home-hero-h{font-size:26px!important}
}
.ffwait{position:fixed;inset:0;background:rgba(4,10,24,.78);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.ffwait-card{width:100%;max-width:460px;background:linear-gradient(165deg,rgba(10,22,46,.97),rgba(6,14,32,.97));border:1px solid rgba(150,186,255,.28);border-radius:20px;padding:24px;color:#eef4ff;box-shadow:0 24px 70px rgba(2,8,20,.6)}
.ffwait-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ffwait-title{font:700 19px Fraunces,serif}
.ffwait-sub{font:400 13px/1.6 Inter;color:#b9cdf0;margin-top:4px}
.ffmin{background:none;border:1px solid rgba(150,186,255,.35);color:#b9cdf0;border-radius:8px;width:30px;height:30px;cursor:pointer;flex:0 0 auto}
.ffwait-pct{display:flex;align-items:baseline;gap:10px;margin:16px 0 8px}
#ffPct{font:700 34px Fraunces,serif;color:#1683FF}
.ffwait-count{font:600 12.5px Inter;color:#b9cdf0}
.ffbar{height:6px;background:rgba(150,186,255,.15);border-radius:4px;overflow:hidden}
.ffbar-fill{height:100%;width:0;background:linear-gradient(90deg,#1683FF,#1683FF);border-radius:4px;transition:width .8s ease}
.ffeta{margin:8px 0 12px;font-size:12.5px}
.ffsteps{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.ffstep{font:500 13.5px Inter;color:#8fa6cc;transition:color .3s}
.ffstep.d{color:#7ef0d4}.ffstep.a{color:#fff;font-weight:600}.ffstep.e{color:#1683FF}
.ffrotate{font-style:italic;text-align:center;margin:4px 0 12px;opacity:.85;transition:opacity .35s;min-height:18px}
.ffstory{border-top:1px solid rgba(150,186,255,.18);padding-top:10px}
.ffstory summary{cursor:pointer;font:600 13px Inter;color:#1683FF;list-style:none}
.ffcomplete{font:700 13px Inter;letter-spacing:2px;color:#7ef0d4;margin-top:12px}
.ffpill{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:16px;z-index:79;background:linear-gradient(135deg,#0c1c3e,#14213D);border:1px solid #1683FF;color:#1683FF;font:700 13px Inter;padding:10px 16px;border-radius:999px;cursor:pointer;box-shadow:0 8px 26px rgba(2,8,20,.55)}
@media(max-width:640px){.ffwait{align-items:flex-end;padding:0}.ffwait-card{max-width:100%;border-radius:20px 20px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom))}.ffpill{bottom:calc(70px + env(safe-area-inset-bottom))}}
.sheet{background:rgba(8,18,40,.96);backdrop-filter:blur(12px);border:1px solid rgba(140,178,255,.36);color:#eef4ff;border-radius:16px;padding:20px;max-width:440px;width:100%}

/* ===== Compact sign-in / sign-up (logged-out, fits one screen) ===== */
.auth-screen{min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:20px 12px}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:0 12px 40px rgba(15,39,72,.08)}
.auth-brand{font-family:Fraunces,serif;font-size:26px;font-weight:700;text-align:center;color:var(--ink)}
.auth-brand b{color:var(--gold)}
.auth-tag{text-align:center;color:var(--slate);font-size:13px;margin:6px 0 18px}
.auth-card label{margin-top:12px}
.auth-primary{width:100%;margin-top:18px;padding:12px;font-size:14.5px}
.auth-switch{text-align:center;font-size:13px;color:var(--slate);margin-top:14px}
.auth-switch a,.auth-links a{color:var(--gold);font-weight:600;cursor:pointer}
.auth-note{text-align:center;margin-top:12px;line-height:1.6}
.auth-links{text-align:center;margin-top:16px;font-size:12px;color:var(--slate);display:flex;gap:8px;justify-content:center;align-items:center}

/* ===== Profile identity ===== */
.pid-card{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,#0F2748,#1E4B8A);border-radius:18px;padding:24px;color:#fff;margin-bottom:14px}
.pid-avatar{width:88px;height:88px;border-radius:50%;flex:none;background:rgba(255,255,255,.15);border:2.5px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.pid-avatar span{font:700 30px Fraunces,serif;color:#fff}
.pid-id h2{font-size:24px}
.pid-head{color:#D7E3F5;font-size:13.5px;margin-top:3px}
.pid-timeline{margin-top:6px}
.pid-titem{display:flex;gap:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.pid-titem:last-child{border-bottom:none}
.pid-tyear{font:700 13px Fraunces,serif;color:var(--gold);width:44px;flex:none;padding-top:2px}
.docsec{padding:10px 0;border-bottom:1px solid var(--line)}
.docsec:last-child{border-bottom:none}
.docrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0 0 10px;font-size:13px}
/* ===== Locked (free-preview) opportunity cards ===== */
.locked-card{border-style:dashed;background:linear-gradient(180deg,#fff, var(--soft))}
.locked-blur b,.locked-blur .sub{filter:blur(5px);user-select:none}
/* ===== White-blue home ===== */
.home-hero{background:linear-gradient(180deg,#FFFFFF,#EFF5FD);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:0 8px 30px rgba(37,99,235,.06)}
.home-hero h1{font-size:27px;color:var(--ink)}
.home-hero p{color:var(--slate);margin-top:8px;font-size:14px;line-height:1.65;max-width:640px}
.ready-strip{display:flex;gap:16px;align-items:center;margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.home-how{display:flex;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.hstep{flex:1;min-width:200px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;border-top:3px solid var(--gold)}
.hstep .sub{margin-top:4px;line-height:1.55}
@media(max-width:640px){.ready-strip{flex-direction:column;align-items:stretch}.hstep{min-width:100%}}
.search-ring{position:relative;width:120px;height:120px;margin:0 auto}
.search-ring svg{width:120px;height:120px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--soft);stroke-width:9}
.ring-fg{fill:none;stroke:var(--gold);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 24px Fraunces,serif;color:var(--ink)}
/* ===== Opportunity dashboard (spec 33) ===== */
.dash-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;background:linear-gradient(180deg,#FFF,#EFF5FD);border:1px solid var(--line);border-radius:16px;padding:16px;flex-wrap:wrap}
.dash-sec{margin:14px 0}
.dash-sec h3{margin-bottom:6px}
body.world-on .dash-sec h3{color:#fff}
table.rep{width:100%;border-collapse:collapse;font-size:13px}
table.rep td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.rep td.rk{color:var(--slate);white-space:nowrap;width:40%}
/* ===== 3D globe landing ===== */
.auth-split{display:flex;gap:26px;align-items:center;justify-content:center;flex-wrap:wrap}
.globe-side{flex:1;min-width:300px;max-width:640px;position:relative}
.globe-hero{width:100%;height:440px;border-radius:20px;background:radial-gradient(ellipse at 50% 40%,#0e2a55 0%,#071630 60%,#040d1f 100%);overflow:hidden;border:1px solid #1d3f74;box-shadow:0 20px 60px rgba(8,25,60,.45)}
.globe-loading{color:#9db8e8;font:600 13px Inter;display:flex;align-items:center;justify-content:center;height:100%}
.globe-cap{color:var(--slate);font:500 12.5px Inter;text-align:center;margin-top:8px}
.globe-panel{position:absolute;top:14px;left:14px;background:rgba(8,22,48,.92);border:1px solid rgba(120,160,255,.35);border-radius:14px;padding:12px 16px;color:#fff;z-index:6;max-width:230px;backdrop-filter:blur(4px)}
.globe2d{height:100%;display:flex;flex-direction:column;justify-content:center;padding:18px 22px;gap:10px}
.g2d-pk{color:#fff;font:700 15px Inter;margin-bottom:4px}
.g2d-route{display:flex;align-items:center;gap:8px}
.g2d-line{height:2px;flex:0 0 46px;border-radius:2px;position:relative}
.g2d-line:after{content:'✈';position:absolute;right:-4px;top:-9px;font-size:11px;color:#fff}
.g2d-dest{flex:1;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.04);border:1px solid;border-radius:10px;padding:7px 12px;color:#e6efff;font:600 13px Inter}
@media(max-width:900px){.globe-hero{height:320px}}
.gchip{display:inline-block;border:1px solid;border-radius:999px;padding:2px 9px;color:#fff;font:600 11.5px Inter;background:rgba(255,255,255,.06)}
.dash-globe-wrap{position:relative;border-radius:20px;overflow:hidden;border:1px solid #1d3f74;box-shadow:0 16px 50px rgba(8,25,60,.35)}
.dash-globe{width:100%;height:380px;background:radial-gradient(ellipse at 50% 40%,#0e2a55 0%,#071630 60%,#040d1f 100%)}
.dash-globe-overlay{position:absolute;top:0;left:0;padding:20px 22px;z-index:4;pointer-events:none}
.dash-globe-overlay .globe-panel,.dash-globe-overlay button{pointer-events:auto}
@media(max-width:700px){.dash-globe{height:260px}.dash-globe-overlay h2{font-size:18px}}
/* ===== Content floating over the 3D world ===== */
.auth-over{display:flex;gap:32px;align-items:center;justify-content:space-between;min-height:78vh;flex-wrap:wrap}
.auth-hero-copy{flex:1;min-width:280px;max-width:520px;color:#fff}
.auth-brand-lg{font:700 44px Fraunces,serif;color:#fff}.auth-brand-lg b{color:#7fb0ff}
.auth-hero-copy p{color:#cfe1ff;font:500 15px Inter;line-height:1.7;max-width:440px}
.globe-panel-float{background:rgba(8,22,48,.9);border:1px solid rgba(120,160,255,.4);border-radius:14px;padding:12px 16px;color:#fff;max-width:280px;margin-top:12px;backdrop-filter:blur(6px)}
.auth-card.glass{background:rgba(255,255,255,.97);box-shadow:0 24px 70px rgba(4,13,31,.55)}
.dash-hero-float{padding:18px 16px;background:linear-gradient(90deg,rgba(4,10,26,.55),rgba(4,10,26,0));border-radius:16px;margin-bottom:6px}
body.world-on #view>h2:first-child{background:linear-gradient(90deg,rgba(4,10,26,.5),transparent);padding:10px 14px;border-radius:12px;display:inline-block}
body.world-on main#view{padding-bottom:40px}
/* ===== DARK GLASS THEME over the video (no white boxes) ===== */
body.world-on{font-size:15px}
body.world-on .card,body.world-on .dash-head,body.world-on .lane,body.world-on .mkt-card{
  background:rgba(6,14,32,.38);border:1px solid rgba(150,186,255,.28);color:#f4f8ff;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 12px 40px rgba(2,8,20,.5)}
body.world-on .card h2,body.world-on .card h3,body.world-on .lane h3,body.world-on .dash-head h2{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.85)}
body.world-on h2,body.world-on h3{text-shadow:0 2px 12px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6)}
body.world-on .card b,body.world-on .dash-head b{color:#fff}
body.world-on .sub{color:#eaf1ff;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.7)}
body.world-on .card .sub,body.world-on .lane .sub{color:#c4d5f5}
body.world-on label{color:#dbe8ff;font-weight:600}
body.world-on input,body.world-on textarea,body.world-on select{
  background:rgba(4,12,28,.62);border:1px solid rgba(140,178,255,.38);color:#fff;border-radius:10px;font-size:14px}
body.world-on input::placeholder,body.world-on textarea::placeholder{color:#8fa8d4}
body.world-on .btn{font-size:14px}
body.world-on .btn.b-gold{background:linear-gradient(135deg,#1683FF,#00D4FF);color:#14213D;border:none;font-weight:700;text-shadow:none}
body.world-on .btn.b-line{background:rgba(140,178,255,.14);border:1px solid rgba(140,178,255,.5);color:#eef4ff}
body.world-on .btn.b-green{background:linear-gradient(135deg,#0E7C66,#16a085);color:#fff;border:none}

/* ============================================================
   FORIFOREIGN PREMIUM DESIGN SYSTEM, override layer v1.8
   Minimal · Spatial · Cinematic · Liquid glass (restrained)
   ============================================================ */
:root{
  --ink:#0E1F42; --ink2:#14295A; --line:rgba(160,196,255,.22); --line-hi:rgba(170,205,255,.42);
  --gold:#1683FF; --gold-2:#00D4FF; --paper:#F5F1E8; --txt:#FFFFFF; --txt-2:#D9E5FB; --txt-3:#A9BEE6;
  --r-s:10px; --r-m:14px; --r-l:20px;
  --sh-1:0 1px 2px rgba(2,8,20,.35),0 8px 24px rgba(2,8,20,.35);
  --sh-2:0 2px 4px rgba(2,8,20,.4),0 18px 50px rgba(2,8,20,.5);
  --ease:cubic-bezier(.22,.61,.36,1);
}
html{scroll-behavior:smooth}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(22,131,255,.35);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(148,184,255,.22);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(148,184,255,.4);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Editorial typography ---------- */
body.world-on h1,body.world-on h2,.home-hero-h,.ffwait-title{font-family:Fraunces,serif;letter-spacing:-.015em;font-weight:600}
body.world-on h2{font-size:24px;line-height:1.2}
body.world-on h3{font:600 15px/1.3 Inter;letter-spacing:.01em;color:var(--txt)}
body.world-on .sub{color:var(--txt-2);line-height:1.65}
label{font:600 11.5px Inter;letter-spacing:.09em;text-transform:uppercase;color:var(--txt-3)!important}

/* ---------- Spatial surfaces: layered depth, not glass-everything ---------- */
body.world-on .card,body.world-on .dash-head,body.world-on .lane,body.world-on .mkt-card{
  background:linear-gradient(168deg,rgba(24,46,94,.58),rgba(15,32,70,.5));
  border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh-1),inset 0 1px 0 rgba(200,220,255,.07);
  backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease);
}
body.world-on .card:hover{border-color:var(--line-hi);box-shadow:var(--sh-2),inset 0 1px 0 rgba(200,220,255,.1)}
/* hero + waiting card = liquid-glass focal layer */
.ffwait-card,.sheet,.home-cta{
  background:linear-gradient(160deg,rgba(28,52,104,.72),rgba(16,34,74,.66));
  backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid rgba(170,200,255,.22);box-shadow:var(--sh-2),inset 0 1px 0 rgba(210,228,255,.1);
}

/* ---------- Buttons: one confident accent ---------- */
.btn{border-radius:12px;font-weight:650;letter-spacing:.01em;transition:transform .18s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease),border-color .25s}
.btn:active{transform:scale(.97)}
.b-gold,.btn.b-gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#141d33;border:0;box-shadow:0 4px 14px rgba(22,131,255,.28),inset 0 1px 0 rgba(255,255,255,.35)}
.b-gold:hover{box-shadow:0 8px 26px rgba(22,131,255,.42),inset 0 1px 0 rgba(255,255,255,.4);transform:translateY(-1px)}
.b-line,.btn.b-line{background:rgba(148,184,255,.06);border:1px solid var(--line-hi);color:var(--txt)}
.b-line:hover{background:rgba(148,184,255,.13);border-color:rgba(170,200,255,.5)}

/* ---------- Inputs ---------- */
body.world-on input,body.world-on select,body.world-on textarea{
  background:rgba(6,13,28,.65);border:1px solid var(--line);border-radius:12px;color:var(--txt);
  transition:border-color .25s,box-shadow .25s}
body.world-on input:focus,body.world-on select:focus,body.world-on textarea:focus{
  outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(22,131,255,.18)}
body.world-on input::placeholder{color:var(--txt-3)}

/* ---------- Navigation: refined, animated indicator ---------- */
body.world-on header{background:linear-gradient(180deg,rgba(6,12,26,.85),rgba(6,12,26,.55));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
#nav button{position:relative;font-weight:600;letter-spacing:.02em;transition:color .25s}
#nav button::after{content:'';position:absolute;left:22%;right:22%;bottom:2px;height:2px;border-radius:2px;background:var(--gold);transform:scaleX(0);transition:transform .3s var(--ease)}
#nav button.on::after{transform:scaleX(1)}

/* ---------- Chips / segments ---------- */
.segbtn{border-radius:999px;transition:all .22s var(--ease)}
.segbtn:hover{border-color:rgba(22,131,255,.55);color:#fff;transform:translateY(-1px)}
body.world-on .segbtn.on{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#141d33;border-color:transparent;box-shadow:0 3px 10px rgba(22,131,255,.3)}
.chip{border-radius:999px;font-weight:600}

/* ---------- Home hero: cinematic spacing ---------- */
.home-hero{padding:28px 6px 10px}
.home-hero-badge{box-shadow:0 6px 22px rgba(22,131,255,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.home-hero-h{margin:18px 0 10px}
.home-cta{border-radius:var(--r-l)}
.home-cta:hover{transform:translateY(-5px) scale(1.008)}
.home-cta-arrow{transition:transform .3s var(--ease)}
.home-cta:hover .home-cta-arrow{transform:translateX(5px)}

/* ---------- View entrance: subtle spatial motion ---------- */
@keyframes ffIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main#view>*{animation:ffIn .5s var(--ease) both}
main#view>*:nth-child(2){animation-delay:.06s}main#view>*:nth-child(3){animation-delay:.12s}
main#view>*:nth-child(4){animation-delay:.18s}main#view>*:nth-child(5){animation-delay:.24s}

/* ---------- Tables, docs, misc polish ---------- */
table td{border-bottom:1px solid rgba(148,184,255,.08)}
.docrow{border-radius:10px;padding:7px 10px;transition:background .2s}
.docrow:hover{background:rgba(148,184,255,.08)}
.empty{border:1px dashed var(--line-hi);border-radius:var(--r-l);padding:34px 18px;background:rgba(8,17,36,.35)}
.toast{border-radius:12px;box-shadow:var(--sh-2)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ UNIVERSAL TAP FEEDBACK ============
   Every interactive element must acknowledge a press instantly, before any network
   call returns. On a slow connection a tap with no visible response feels broken,
   so the response is purely local: transform + ripple, no waiting. */
.btn,.segbtn,button,.ctryrow,.ctry-head,.pack,.lane,.card[onclick],[onclick]{
  -webkit-tap-highlight-color:transparent;
  transition:transform .08s ease,filter .12s ease,box-shadow .12s ease,background .12s ease;

.ff-ripple{position:absolute;border-radius:50%;transform:scale(0);pointer-events:none;

header a.on::after,header button.on::after,#nav button.on::after{
  content:'';position:absolute;left:8%;right:8%;bottom:-6px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,#1683FF,#00D4FF)}

<script>

const isAdminRole=r=>ADMIN_ROLES.includes(r);
async function refreshCredits(){
  try{const d=await api('/api/credits');CREDITS=d.credits;const p=$('creditPill');if(p)p.textContent=CREDITS+' credit'+(CREDITS===1?'':'s')}catch(e){}

/* SPEED: short-lived cache for GET payloads so switching tabs paints instantly while
   fresh data loads behind it. Any write clears the cache so nothing goes stale. */
const _gc=new Map();
function cacheGet(p,maxAgeMs){const e=_gc.get(p);return (e&&Date.now()-e.at<(maxAgeMs||45000))?e.data:null}
function cacheSet(p,d){_gc.set(p,{data:d,at:Date.now()});if(_gc.size>40)_gc.clear()}

/* ============ INSTANT FEEDBACK ENGINE ============
   Applies to every button on every screen without touching each one individually.
   1. Ripple + press animation fire on pointerdown, before any handler runs.
   2. Any button whose handler returns a promise is put into a busy state until it
      settles, so a slow network never looks like a dead tap.
   3. A top progress bar reflects real in-flight requests. */
(function(){
  // 1. Ripple from the exact tap point.
  document.addEventListener('pointerdown',e=>{
    const el=e.target.closest('button,.btn,.segbtn,.pack,.lane,.ctryrow,.ctry-head');
    if(!el||el.classList.contains('ff-busy'))return;
    try{
      const cs=getComputedStyle(el);
      if(cs.position==='static')el.style.position='relative';
      if(cs.overflow!=='hidden')el.style.overflow='hidden';
      const r=el.getBoundingClientRect();
      const size=Math.max(r.width,r.height);
      const d=document.createElement('span');
      d.className='ff-ripple';
      d.style.width=d.style.height=size+'px';
      d.style.left=(e.clientX-r.left-size/2)+'px';
      d.style.top=(e.clientY-r.top-size/2)+'px';

      setTimeout(()=>d.remove(),520);
    }catch(err){}
  },{passive:true});

  // 2. Busy state for any click handler that does async work.
  document.addEventListener('click',e=>{
    const el=e.target.closest('button,.btn,.segbtn');
    if(!el||el.disabled||el.classList.contains('ff-busy'))return;
    if(el.dataset.noBusy==='1')return;
    // Give the handler a tick to start; if it is still working, show the spinner.
    setTimeout(()=>{
      if(window._netBusy>0&&document.body.contains(el)&&!el.disabled){

        const clear=()=>{el.classList.remove('ff-busy')};
        const watch=setInterval(()=>{if(window._netBusy<=0){clearInterval(watch);clear()}},120);

function netStart(){
  window._netBusy++;

  b.style.opacity='1';b.style.width='35%';
  clearTimeout(window._ntCreep);
  window._ntCreep=setTimeout(()=>{if(window._netBusy>0)b.style.width='72%'},400);

function netEnd(){
  window._netBusy=Math.max(0,window._netBusy-1);
  if(window._netBusy>0)return;
  const b=document.getElementById('ffTop');if(!b)return;
  clearTimeout(window._ntCreep);

async function api(p,o={}){

async function _apiRaw(p,o={}){

async function doAuth(mode){
  const email=$('a-email').value.trim(),password=$('a-pass').value;
  if(!email||password.length<8){toast('Enter email and a password of at least 8 characters');return}
  // Authentication can take several seconds on a slow connection: show it working
  // immediately, on the button the user actually pressed.
  const _authBtn=document.querySelector('.auth-card .b-gold');
  const _authLabel=_authBtn?_authBtn.textContent:'';
  const _authOn=(txt)=>{if(_authBtn){_authBtn.disabled=true;_authBtn.dataset.noBusy='1';_authBtn.textContent=txt}};
  const _authOff=()=>{if(_authBtn){_authBtn.disabled=false;_authBtn.textContent=_authLabel}};
  netStart();
  try{
    if(mode==='signup'){
      const name=($('a-name')&&$('a-name').value.trim())||'';
      if(window._authBusy){netEnd();return}window._authBusy=true;
      _authOn('Creating your account…');
      const wa=(document.getElementById('su-wa')||{}).value||'';const {error}=await SB.auth.signUp({email,password,options:{data:{full_name:name,whatsapp:wa},emailRedirectTo:location.origin}});
      /* A mail-server failure must NOT block signup. We confirm accounts ourselves on the
         server, so the confirmation email is a courtesy, not the gate. Supabase still
         creates the account and then reports the send failure, so we continue. */
      if(error){
        const m=String(error.message||'').toLowerCase();
        const mailOnly=/sending.*(email|mail|confirmation)|smtp|email.*not.*sent|error sending/.test(m);
        if(!mailOnly)throw error;
      }
      // Confirm instantly server-side, then sign straight in: no email link needed, ever.
      try{await fetch('/api/auth/confirmed',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email})})}catch(e){}
      const si=await SB.auth.signInWithPassword({email,password});
      if(si.error){toast('Account created. Please sign in now.');renderAuth('signin')}
      else toast('Welcome to ForiForeign, '+(name.split(' ')[0]||'')+'! If asked, check your email inbox for a note from admin@foriforeign.com to verify.');
    }else{
      if(window._authBusy){netEnd();return}window._authBusy=true;
      _authOn('Signing you in…');
      let {error}=await SB.auth.signInWithPassword({email,password});
      if(error&&/not confirmed|confirm/i.test(error.message||'')){
        // Heal the stuck-confirmation loop automatically, once, then retry.
        try{await fetch('/api/auth/confirmed',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email})})}catch(e){}

  },1000);

function matchBadge(m){

  const [cls,word]=map[m.status]||['c-gray',m.status];

function pkrHint(txt){
  try{
    const m=String(txt||'').match(/([$€£])\s?([\d,]+(?:\.\d+)?)|([\d,]+(?:\.\d+)?)\s?(USD|EUR|GBP)/i);
    if(!m)return '';
    const amt=parseFloat((m[2]||m[3]||'').replace(/,/g,''));if(!isFinite(amt)||amt<=0)return '';
    const cur=(m[1]||m[4]||'$').toUpperCase();
    const mult=(cur==='€'||cur==='EUR')?1.08:(cur==='£'||cur==='GBP')?1.27:1;
    const rate=(SITE&&SITE.fx&&Number(SITE.fx.usd_to_pkr))||278;
    const pkr=amt*mult*rate;
    const nice=pkr>=1e7?(pkr/1e7).toFixed(1)+' crore':pkr>=1e5?(pkr/1e5).toFixed(1)+' lakh':Math.round(pkr).toLocaleString();
    return ' ≈ Rs '+nice;
  }catch(e){return ''}
}

async function uploadAvatar(input){
  const f=input.files&&input.files[0];if(!f)return;
  toast('Uploading photo…');
  const fd=new FormData();fd.append('photo',f);
  try{const r=await fetch('/api/me/avatar',{method:'POST',headers:{authorization:'Bearer '+SESSION.access_token},body:fd});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Upload failed');

async function loadFields(){
  let d;try{d=await api('/api/profile/fields')}catch(e){return}
  const el=$('verifyList');if(!el)return;
  const fields=(d.fields||[]).filter(f=>f.value);
  if(!fields.length){el.innerHTML='<span class="sub">No verified fields yet. Upload your CV, degree and transcript, then cross-check.</span>';return}
  const label=k=>({full_name:'Full name',date_of_birth:'Date of birth',phone:'Phone',nationality:'Nationality',headline:'Headline',field:'Field',highest_degree:'Highest degree',highest_institution:'Institution',graduation_year:'Graduation year',cgpa:'CGPA',english_test:'English test',english_score:'English score'}[k]||k);
  const chip=s=>({verified:'c-green',conflicting:'c-red',provided:'c-blue',extracted:'c-gold',inferred:'c-gray'}[s]||'c-gray');
  const word=s=>({verified:'Verified',conflicting:'Conflict',provided:'Confirmed',extracted:'Extracted',inferred:'Inferred'}[s]||s);
  el.innerHTML=fields.map(f=>{
    const srcNames=[...new Set((f.sources||[]).map(s=>s.name))];
    const distinctVals=[...new Set((f.sources||[]).map(s=>s.value))];
    if(f.status==='conflicting'&&!f.resolved){
      return `<div class="card" style="border-color:var(--crimson);background:var(--crimson-soft)">
      <div class="spread"><b>${esc(label(f.field_key))}</b><span class="chip c-red">Conflict</span></div>
      <div class="sub" style="margin:6px 0">Documents disagree. Choose the correct value:</div>
      ${distinctVals.map(v=>`<button class="btn b-line" style="margin:3px 4px 0 0" onclick="resolveField('${f.field_key}','${escAttr(v)}',this)">${esc(v)}</button>`).join('')}
      <div class="sub" style="margin-top:6px">Seen in: ${esc(srcNames.join(', '))}</div></div>`;
    }
    return `<div class="checkrow">
      <div style="flex:1;min-width:0"><span style="font-weight:600">${esc(label(f.field_key))}:</span> ${esc(f.value)}
      ${srcNames.length?`<div class="sub" style="font-size:11px">Source: ${esc(srcNames.join(', '))}${f.status==='verified'?' · agreed across '+srcNames.length+' documents':''}</div>`:''}</div>
      <span class="chip ${chip(f.status)}">${word(f.status)}</span></div>`;
  }).join('');
}

async function uploadDocs(){window._afterUpload=()=>{toast('Uploaded. Reading your documents now…');
  let tries=0;const iv=setInterval(async()=>{tries++;try{const d=await api('/api/me');ME=d.me;const dx=(ME&&ME.deep)||{};const n=[ME.headline,ME.field,dx.profession,dx.total_experience_years,dx.age,dx.city].filter(Boolean).length+((dx.certifications||[]).length?1:0)+((dx.research_papers||[]).length?1:0)+((ME.education||[]).length?1:0)+((ME.publications||[]).length?1:0);
    if(n>=4||tries>=15){clearInterval(iv);toast('Profile built automatically, '+Math.max(n,4)+' details extracted. Tap Profile to view.');if(TAB==='home')vHome();if(TAB==='profile')vProfile();}}catch(e){if(tries>=15)clearInterval(iv)}},4000);
  setTimeout(()=>{if(TAB==='home')vHome()},700)};
  const upKind=window._uploadKind||null;
  const files=$('doc-files').files;
  if(!files.length){return}
  const prog=$('uploadProgress');
  const items=[...files].map((f,i)=>({name:f.name,id:'up'+i}));
  if(prog)prog.innerHTML=items.map(it=>`<div class="uprow"><span class="upname">${esc(it.name)}</span><div class="upbar"><div class="upfill" id="${it.id}"></div></div><span class="uppct" id="${it.id}pct">0%</span></div>`).join('');
  const fd=new FormData();for(const f of files)fd.append('files',f);
  if(window._uploadKind){fd.append('kind',window._uploadKind);window._uploadKind=null}
  try{
    await new Promise((resolve,reject)=>{
      const xhr=new XMLHttpRequest();
      xhr.open('POST','/api/documents');
      xhr.setRequestHeader('authorization','Bearer '+SESSION.access_token);
      xhr.upload.onprogress=(e)=>{
        if(!e.lengthComputable)return;
        const pct=Math.round(e.loaded/e.total*100);
        items.forEach(it=>{const bar=$(it.id),pc=$(it.id+'pct');if(bar){bar.style.width=pct+'%';bar.style.background=pct>=100?'linear-gradient(90deg,#16a085,#2dd4bf)':'linear-gradient(90deg,#1683FF,#00D4FF)'}if(pc)pc.textContent=pct+'%'});
      };
      xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300)resolve(JSON.parse(xhr.responseText));else{try{reject(new Error(JSON.parse(xhr.responseText).error||'Upload failed'))}catch(e){reject(new Error('Upload failed'))}}};
      xhr.onerror=()=>reject(new Error('Network error'));
      xhr.send(fd);
    }).then(d=>{
      items.forEach(it=>{const bar=$(it.id),pc=$(it.id+'pct');if(bar){bar.style.width='100%';bar.style.background='linear-gradient(90deg,#16a085,#2dd4bf)'}if(pc){pc.textContent='✓';pc.style.color='#2dd4bf'}});
      const bad=(d.results||[]).filter(x=>x.error);
      toast(bad.length?('Some failed: '+bad.map(x=>x.name).join(', ')):'✓ Uploaded. The agent is reading your documents, your profile fills itself within a minute.');
      loadDocs();
      if(!upKind||upKind==='cv')setTimeout(()=>openFinder(true),900);
      setTimeout(async()=>{try{const me=await api('/api/me');ME=me.me;toast('Profile updated from your documents.');vProfile();}catch(e){}},45000);
    });
  }catch(e){toast(e.message);if(prog)prog.innerHTML='<div class="sub" style="color:#fb7185">'+esc(e.message)+'</div>'}
  $('doc-files').value='';
}
async function reviewExtraction(){

  const keys=Object.keys(patch);
  if(!keys.length&&!refs.length){toast('Nothing new found to add. Your profile already holds what the documents show.');return}
  window._review={patch,refs,keep:{},keepRefs:refs.map((_,i)=>i)};
  keys.forEach(k=>window._review.keep[k]=true);
  const fmt=v=>Array.isArray(v)?v.map(x=>typeof x==='string'?x:Object.values(x).filter(Boolean).join(', ')).join('  •  '):String(v);
  const wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;inset:0;background:rgba(20,33,61,.5);z-index:60;overflow:auto;padding:20px 10px';
  wrap.innerHTML=`<div style="max-width:640px;margin:0 auto;background:rgba(8,18,40,.9);backdrop-filter:blur(12px);border:1px solid rgba(140,178,255,.36);color:#eef4ff;border-radius:16px;padding:18px">
  <div class="spread"><h2>Review before saving</h2><button class="btn b-line" onclick="this.closest('div[style*=fixed]').remove()" aria-label="Close">✕</button></div>
  <div class="sub" style="margin:6px 0">The agent extracted these from your documents. Nothing is saved until you confirm. Untick anything you don't want.</div>
  ${keys.map(k=>`<div class="checkrow"><label style="margin:0;flex:1;min-width:0"><input type="checkbox" checked style="width:auto" onchange="window._review.keep['${k}']=this.checked"> <b style="color:var(--ink)">${esc(k)}</b>
  <div class="sub" style="margin-top:2px">${esc(fmt(patch[k])).slice(0,300)}</div></label>
  <span class="chip c-blue">extracted</span></div>`).join('')}
  ${refs.length?`<div style="margin-top:8px"><b>Referees found:</b>${refs.map((r,i)=>`<div class="checkrow"><label style="margin:0;flex:1"><input type="checkbox" checked style="width:auto" onchange="{const s=new Set(window._review.keepRefs);this.checked?s.add(${i}):s.delete(${i});window._review.keepRefs=[...s]}"> ${esc(r.name)} <span class="sub">${esc([r.title,r.institution].filter(Boolean).join(', '))}</span></label></div>`).join('')}</div>`:''}
  <div class="row" style="margin-top:14px"><button class="btn b-green" onclick="applyReview(this)">Save confirmed information</button>
  <button class="btn b-line" onclick="this.closest('div[style*=fixed]').remove()">Cancel</button></div></div>`;
  document.body.appendChild(wrap);
}
async function applyReview(btn){

  const r=window._review||{};
  const patch={};Object.keys(r.patch||{}).forEach(k=>{if(r.keep[k])patch[k]=r.patch[k]});
  const referees=(r.keepRefs||[]).map(i=>r.refs[i]).filter(Boolean);
  try{const d=await api('/api/profile/autofill/apply',{method:'POST',body:{patch,referees}});
    toast('Saved: '+((d.applied||[]).join(', ')||'referees only')+(d.refsAdded?(' and '+d.refsAdded+' referees'):''));

}

const QR=(function(){

  function genPoly(n){let p=[1];for(let i=0;i<n;i++){const q=[1,EXP[i]],r=new Array(p.length+1).fill(0);
    for(let j=0;j<p.length;j++)for(let k=0;k<2;k++)r[j+k]^=mul(p[j],q[k]);p=r}return p}
  function ecc(data,n){const res=new Array(n).fill(0),g=genPoly(n);
    for(const d of data){const f=d^res[0];res.shift();res.push(0);
      for(let i=0;i<n;i++)res[i]^=mul(g[i+1],f)}return res}
  // capacity/config per version for ECC-M, byte mode
  const V=[null,
   {size:21,cap:14,ec:10,blocks:[[1,26,16]]},
   {size:25,cap:26,ec:16,blocks:[[1,44,28]]},
   {size:29,cap:42,ec:26,blocks:[[1,70,44]]},
   {size:33,cap:62,ec:18,blocks:[[2,50,32]]},
   {size:37,cap:84,ec:24,blocks:[[2,64,43]]},
   {size:41,cap:106,ec:16,blocks:[[4,43,27]]},
   {size:45,cap:122,ec:18,blocks:[[4,49,31]]},
   {size:49,cap:152,ec:22,blocks:[[2,60,38],[2,61,39]]}];
  const ALIGN=[[],[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42]];
  function make(text){
    const bytes=new TextEncoder().encode(text);
    let v=1;while(v<V.length&&bytes.length>V[v].cap)v++;
    if(v>=V.length)throw new Error('QR: text too long');

    // bit stream: mode(4) + length(8) + data + terminator

    put(4,4);put(bytes.length,8);for(const b of bytes)put(b,8);
    const totalData=cfg.blocks.reduce((s,[c,t,d])=>s+c*d,0);
    while(bits.length<totalData*8&&bits.length%8!==0)bits.push(0);
    while(bits.length<totalData*8){put(0xEC,8);if(bits.length<totalData*8)put(0x11,8)}
    const dataBytes=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];dataBytes.push(b)}
    // split into blocks, compute ECC, interleave
    const dBlocks=[],eBlocks=[];let pos=0;
    for(const [count,total,dataLen] of cfg.blocks){for(let i=0;i<count;i++){
      const blk=dataBytes.slice(pos,pos+dataLen);pos+=dataLen;dBlocks.push(blk);eBlocks.push(ecc(blk,total-dataLen))}}
    const maxD=Math.max(...dBlocks.map(b=>b.length)),maxE=Math.max(...eBlocks.map(b=>b.length));
    const final=[];
    for(let i=0;i<maxD;i++)for(const b of dBlocks)if(i<b.length)final.push(b[i]);
    for(let i=0;i<maxE;i++)for(const b of eBlocks)if(i<b.length)final.push(b[i]);
    // matrix
    const m=Array.from({length:size},()=>new Array(size).fill(null));
    const fn=Array.from({length:size},()=>new Array(size).fill(false));
    const finder=(r,c)=>{for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){const y=r+i,x=c+j;
      if(y<0||x<0||y>=size||x>=size)continue;fn[y][x]=true;
      const on=(i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6))||(i>=2&&i<=4&&j>=2&&j<=4);
      m[y][x]=on?1:0}};
    finder(0,0);finder(0,size-7);finder(size-7,0);
    for(const p of ALIGN[v])for(const q of ALIGN[v]){
      if((p===6&&q===6)||(p===6&&q===size-7)||(p===size-7&&q===6))continue;
      for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){m[p+i][q+j]=(Math.max(Math.abs(i),Math.abs(j))!==1)?1:0;fn[p+i][q+j]=true}}

    for(let col=size-1;col>0;col-=2){if(col===6)col--;
      for(let n=0;n<size;n++){const row=up?size-1-n:n;

    m[8][7]=fbits[6];m[8][8]=fbits[7];m[7][8]=fbits[8];
    for(let i=9;i<15;i++)m[14-i][8]=fbits[i];
    for(let i=0;i<8;i++)m[size-1-i][8]=fbits[i];
    for(let i=8;i<15;i++)m[8][size-15+i]=fbits[i];
    m[8][size-8]=fbits[7];   // the cell adjoining the top-right finder, otherwise left unset
    m[size-8][8]=1;
    return m;
  }
  return {make};
})();

async function saveAdminSettings(btn){
  btn.disabled=true;
  const patch={};
  document.querySelectorAll('#adminBody [data-sec]').forEach(el=>{
    const s=el.dataset.sec,k=el.dataset.key;
    patch[s]=patch[s]||{};
    patch[s][k]=el.type==='checkbox'?el.checked:el.value;
  });
  const planDocs=[...document.querySelectorAll('#adminBody [data-plandoc]')].filter(el=>el.checked).map(el=>el.dataset.plandoc);
  if(planDocs.length)patch.case_plan={docs:planDocs};
  const aaEls=[...document.querySelectorAll('#adminBody [data-aa]')];
  if(aaEls.length){
    const cur=(window._cfg&&window._cfg.apply_assistant)||{};
    const aa={enabled:cur.enabled!==false,apply_button:true,fallback:'download',providers:{},store_urls:{}};
    aaEls.forEach(el=>{const k=el.dataset.aa;
      if(k==='enabled'){if(!el.disabled)aa.enabled=el.checked}
      else if(k==='apply_button')aa.apply_button=el.checked;
      else if(k==='fallback')aa.fallback=el.value;
      else if(k==='store_chrome')aa.store_urls.chrome=el.value.trim();

  const bg=document.querySelector('#adminBody [data-bgvid]');if(bg)patch.background_video_url=bg.value.trim();
  if(window._cfg&&window._cfg.features)patch.features=window._cfg.features;

    diagOut('DEEP AI DIAGNOSIS  -  '+d.build+'\n\nMODEL PROBES:\n'+P+'\n\nDISCOVERY PIPELINE:\n'+D+'\n\nRECENT ERRORS:\n'+E);

function renderReviews(){
  const rv=window._reviews||[];
  $('adminBody').innerHTML=`<div class="sub" style="margin-bottom:8px">Only add genuine reviews. These appear on the homepage. Hidden ones are stored but not shown.</div>
  ${rv.map((r,i)=>`<div class="card"><div class="spread"><b>Review ${i+1}</b><button class="btn b-line" style="padding:3px 10px" onclick="window._reviews.splice(${i},1);renderReviews()">Remove</button></div>
  <label>Name</label><input value="${esc(r.name||'')}" onchange="window._reviews[${i}].name=this.value">
  <label>Country</label><input value="${esc(r.country||'')}" onchange="window._reviews[${i}].country=this.value">
  <label>Rating (1-5)</label><input type="number" min="1" max="5" value="${esc(r.rating||5)}" onchange="window._reviews[${i}].rating=parseInt(this.value)">
  <label>Review text</label><textarea onchange="window._reviews[${i}].text=this.value">${esc(r.text||'')}</textarea>
  <div class="row" style="margin-top:8px"><label style="margin:0"><input type="checkbox" ${r.visible!==false?'checked':''} style="width:auto" onchange="window._reviews[${i}].visible=this.checked"> Visible</label></div></div>`).join('')}

async function importUniFile(btn){
  const inp=$('uni-file');const cc=($('ub-cc')||{}).value;
  if(!inp||!inp.files.length){toast('Choose a file first.');return}
  btn.disabled=true;btn.textContent='Importing…';
  try{
    const fd=new FormData();fd.append('file',inp.files[0]);fd.append('country_code',cc);
    const r=await fetch('/api/admin/universities/import',{method:'POST',headers:{authorization:'Bearer '+((SESSION&&SESSION.access_token)||'')},body:fd});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Import failed');
    toast('Imported: '+d.created+' new, '+d.updated+' updated. AI research started.');vAdmin();
  }catch(e){toast(e.message);btn.disabled=false;btn.textContent='Import file'}
}

async function vBuy(){
  let d;

  try{const r=await apiFast('/api/pricing',300000);d=r.cached}
  catch(e){$('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>';return}
  const packs=((d.pricing||{}).packs)||[];
  // Named, benefit-rich packages. Featured = Smart (best value), highlighted in gold.
  const cfgTiers=((SITE&&SITE.packages&&SITE.packages.tiers)||[]);
  const META={};
  cfgTiers.forEach(t=>{META[t.credits]={name:t.name,view:t.view,apply:t.credits,tag:t.featured?'MOST POPULAR':'',feats:t.feats||['See your '+t.view+' best-matched opportunities','Prepare and apply to any '+t.credits]};});
  if(!Object.keys(META).length){META[1]={name:'Solo',view:2,apply:1,tag:'',feats:['See your 2 best-matched opportunities','Prepare and apply to any 1']};META[5]={name:'Smart',view:8,apply:5,tag:'MOST POPULAR',feats:['See your 8 best-matched opportunities','Prepare and apply to any 5']};META[10]={name:'Premium',view:15,apply:10,tag:'BEST VALUE',feats:['See your 15 best-matched opportunities','Prepare and apply to any 10']};}
  const packCard=p=>{const m=META[p.credits]||{name:p.credits+(p.credits===1?' case':' cases'),view:p.credits<=1?2:p.credits*2,apply:p.credits,tag:'',feats:['See your '+(p.credits<=1?2:p.credits*2)+' best-matched opportunities','Prepare and apply to any '+p.credits,'Every document tailored to each position, verified from official pages']};const feat=m.tag==='MOST POPULAR';
    return `<div class="card" style="position:relative;border:${feat?'2px solid #F5B841':'1px solid rgba(140,178,255,.3)'};background:${feat?'linear-gradient(160deg,rgba(245,184,65,.12),rgba(22,131,255,.05))':'rgba(10,22,44,.6)'};margin-bottom:12px;overflow:hidden">
      ${m.tag?`<div style="position:absolute;top:0;right:0;background:${feat?'#F5B841':'#1683FF'};color:${feat?'#3a2a00':'#fff'};font:800 10px Inter;padding:4px 12px;border-radius:0 0 0 10px;letter-spacing:.05em">${m.tag}</div>`:''}
      <div style="font:800 22px Georgia,serif;color:${feat?'#FFD070':'#fff'}">${esc(m.name)}</div>
      <div style="margin:2px 0 8px"><span style="font:800 20px Inter;color:#2dd4bf">${p.pkr>0?'Rs '+p.pkr.toLocaleString():'Soon'}</span> <span class="sub">one-time</span></div>
      <div style="display:flex;gap:16px;margin-bottom:8px">
        <div><div style="font:800 18px Inter;color:#00D4FF">${m.view}</div><div class="sub" style="font-size:10.5px">matches shown</div></div>
        <div><div style="font:800 18px Inter;color:#00D4FF">${m.apply}</div><div class="sub" style="font-size:10.5px">you can apply</div></div>
      </div>
      ${(m.feats||[]).map(f=>`<div class="sub" style="padding:2px 0;line-height:1.5"><span style="color:#2dd4bf">✓</span> ${esc(f)}</div>`).join('')}
      <button class="btn ${feat?'b-gold':'b-line'}" style="width:100%;margin-top:12px;font-size:15px;padding:12px" onclick="buyPack(${p.credits})">Choose ${esc(m.name)}</button>
    </div>`;};
  setTimeout(promoTicker,300);
  $('view').innerHTML=`<div class="spread" style="margin-bottom:6px"><h2 style="margin:0">Choose your package</h2><button class="btn b-line" style="padding:4px 12px" onclick="go('home')" aria-label="Close">✕</button></div>
  <div id="refBox"></div>
  <div style="border:1px solid rgba(0,212,255,.4);background:linear-gradient(135deg,rgba(0,212,255,.1),rgba(22,131,255,.05));border-radius:12px;padding:12px 14px;margin-bottom:14px">
    <b style="color:#7EE6FF;font-size:14px">These are not random listings, they are hand-picked for you.</b>
    <div class="sub" style="margin-top:5px;line-height:1.6">Every opportunity is matched to your exact profile, field and goals, and verified on its official page. Because each application is this precise and this well-prepared, your real chance of selection is far higher than applying blindly on your own.</div>
  </div>
  ${HM&&HM.promo&&HM.promo.active?`<div style="position:relative;border:2px solid #F5B841;background:linear-gradient(160deg,rgba(245,184,65,.18),rgba(22,131,255,.05));border-radius:14px;padding:16px;margin-bottom:12px;overflow:hidden">
    <div style="position:absolute;top:0;right:0;background:#F5B841;color:#3a2a00;font:800 10px Inter;padding:4px 12px;border-radius:0 0 0 10px;letter-spacing:.05em">LIMITED TIME</div>
    <div style="font:800 22px Georgia,serif;color:#FFD070">🎁 Free Solo</div>
    <div class="sub" style="margin:4px 0 8px">1 complete application, prepared free. Ends in <b id="promoTick" style="color:#FFD070">…</b></div>
    <div class="sub" style="padding:2px 0"><span style="color:#2dd4bf">✓</span> See your 2 best-matched opportunities</div>
    <div class="sub" style="padding:2px 0"><span style="color:#2dd4bf">✓</span> Prepare and apply to any 1, completely free</div>
    ${HM.promo.claimed
      ?`<div class="chip c-green" style="margin-top:12px;display:inline-block">Claimed ✓ your free case is active</div>`
      :`<button class="btn b-gold" style="width:100%;margin-top:12px;font-size:15px;padding:12px" onclick="(async b=>{b.disabled=true;try{await api('/api/promo/claim',{method:'POST'});await refreshCredits();toast('Your free Solo case is active! Opening your best matches…');HM=null;if(window._lastMatches){showMatches(window._lastMatches.kind,Object.assign({},window._lastMatches.opts||{},{_fromCache:true}))}else{go('home')}}catch(e){toast(e.message);b.disabled=false}})(this)">Activate my free Solo package</button>`}
  </div>`:''}
  ${packs.map(packCard).join('')}
  <div style="border:1px solid rgba(245,184,65,.35);background:rgba(245,184,65,.06);border-radius:12px;padding:10px 14px;margin:4px 0 12px;font-size:12.5px">
    A consultant in Pakistan charges <b>Rs 50,000–150,000</b> per application, verifies nothing, and you still write everything yourself. <b style="color:#F5B841">ForiForeign starts at Rs ${lowestPkgPrice().toLocaleString()}</b>, fully prepared, officially verified, you simply press Send.
  </div>
  ${(()=>{const rv=((SITE&&SITE.reviews)||[]).filter(r=>r&&r.text).slice(0,2);const n=(SITE&&SITE.stats&&SITE.stats.cases_prepared)||null;
    return (rv.length||n)?`<div style="border:1px solid rgba(0,184,169,.4);background:rgba(0,184,169,.06);border-radius:12px;padding:11px 14px;margin-bottom:12px">
      <b style="color:#2dd4bf;font-size:13px">Trusted by ambitious Pakistanis${n?', '+Number(n).toLocaleString()+'+ applications prepared':''}</b>
      ${rv.map(r=>`<div style="margin-top:7px"><span style="color:#FFD070">${'★'.repeat(Math.max(1,Math.min(5,r.stars||5)))}</span> <span class="sub" style="color:#EAF2FF">${esc(String(r.text).slice(0,90))}</span> <span class="sub">— ${esc(r.name||'Client')}</span></div>`).join('')}
    </div>`:'';})()}
  <div class="card"><h3 style="margin-top:0">How credits work</h3>
  <div class="sub" style="line-height:1.7">Your credits never expire before your chosen opportunities do, use them anytime. Searching is always free and unlimited; a credit is spent only when YOU pick an opportunity and confirm. Every prepared case is fully editable and re-openable at no extra cost.</div></div>
  <div class="card" style="margin-top:14px"><h3>How to pay</h3>
  <div class="sub" style="margin-top:6px;line-height:1.7">${esc((SITE&&SITE.payment&&SITE.payment.instructions)||'Transfer to the account below, then submit your reference.')}</div>
  ${SITE&&SITE.payment&&(SITE.payment.account_number||SITE.payment.iban||SITE.payment.jazzcash_number||SITE.payment.easypaisa_number)?`<div class="card" style="background:var(--soft);margin-top:8px">
    ${SITE.payment.bank_name?`<div><b>Bank:</b> ${esc(SITE.payment.bank_name)}</div>`:''}
    ${SITE.payment.account_title?`<div><b>Title:</b> ${esc(SITE.payment.account_title)}</div>`:''}
    ${SITE.payment.account_number?`<div><b>Account #:</b> ${esc(SITE.payment.account_number)}</div>`:''}
    ${SITE.payment.iban?`<div><b>IBAN:</b> ${esc(SITE.payment.iban)}</div>`:''}
    ${SITE.payment.jazzcash_number?`<div><b>JazzCash:</b> ${esc(SITE.payment.jazzcash_number)}</div>`:''}
    ${SITE.payment.easypaisa_number?`<div><b>Easypaisa:</b> ${esc(SITE.payment.easypaisa_number)}</div>`:''}
  </div>`:'<div class="sub" style="margin-top:8px;color:var(--crimson)">Payment account details are being set up. Please contact support to pay.</div>'}
  <div class="sub" style="margin-top:8px">After transferring, choose a package above and submit your transaction reference. ${esc((d.pricing||{}).refund_policy||'')}</div></div>`;
}
function waOpen(phone,text){
  const p=String(phone||'').replace(/[^0-9]/g,'').replace(/^0/,'92');
  if(!p){toast('No WhatsApp number on file for this user.');return}
  window.open('https://wa.me/'+p+(text?'?text='+encodeURIComponent(text):''),'_blank');
}
function copyTxt(t,btn){navigator.clipboard.writeText(t).then(()=>{btn.textContent='Copied ✓';setTimeout(()=>btn.textContent='Copy',1200)}).catch(()=>{})}
async function buyPack(credits){
  const P=(SITE&&SITE.payment)||{};
  const row=(l,v)=>v?`<div class="row" style="justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(140,178,255,.14)"><span class="sub" style="font-weight:700">${l}</span><span style="display:flex;gap:8px;align-items:center"><b style="font-size:13.5px">${esc(v)}</b><button class="btn b-line" style="padding:3px 10px;font-size:11px" onclick="copyTxt('${escAttr(v)}',this)">Copy</button></span></div>`:'';
  const w=document.createElement('div');w.className='ff-ack';
  w.style.cssText='position:fixed;inset:0;background:rgba(4,10,24,.85);z-index:75;display:flex;align-items:center;justify-content:center;padding:16px';
  w.innerHTML=`<div style="max-width:430px;width:100%;max-height:92vh;overflow:auto;background:rgba(8,18,40,.97);border:1px solid rgba(0,212,255,.5);border-radius:16px;padding:18px;color:#eef4ff">
    <div class="spread"><h3 style="margin:0">Pay for ${credits} case${credits===1?'':'s'}, one step</h3><button class="btn b-line" style="padding:3px 10px" onclick="this.closest('.ff-ack').remove()" aria-label="Close">✕</button></div>
    <div class="sub" style="margin:6px 0 8px">1. Send the amount to ANY account below. 2. Tap I HAVE PAID. Done, we verify and your cases activate, usually under 30 minutes.</div>
    ${row('JazzCash',P.jazzcash_number)}${row('Easypaisa',P.easypaisa_number)}${row('Bank',P.bank_name)}${row('Title',P.account_title)}${row('Account #',P.account_number)}${row('IBAN',P.iban)}
    <input id="payRef" placeholder="Transaction ID / reference (optional now)" style="margin-top:10px">
    <button class="btn b-gold" style="width:100%;margin-top:10px;padding:12px;font-size:15px" onclick="(async b=>{b.disabled=true;try{const d=await api('/api/payments',{method:'POST',body:{credits,reference:document.getElementById('payRef').value||'PENDING'}});this.closest&&0;w.remove();toast('Received! We are confirming your payment, usually under 30 minutes. You will see it on your dashboard.');}catch(e){toast(e.message);b.disabled=false}})(this)">I HAVE PAID, activate my cases</button>
    ${(()=>{const rv=((SITE&&SITE.reviews)||[]).filter(r=>r&&r.text).slice(0,2);return rv.length?`<div style="margin-top:10px">${rv.map(r=>`<div style="border:1px solid rgba(245,184,65,.4);background:rgba(245,184,65,.06);border-radius:10px;padding:8px 10px;margin-top:6px"><span style="color:#FFD070">${'★'.repeat(Math.max(1,Math.min(5,r.stars||5)))}</span> <span class="sub" style="color:#EAF2FF">${esc(String(r.text).slice(0,80))}</span> <span class="sub">— ${esc(r.name||'Client')}</span></div>`).join('')}</div>`:''})()}
    <div class="sub" style="margin-top:8px;text-align:center">Every opportunity verified on official pages. Your money is safe: unverified payments are simply returned.</div></div>`;
  document.body.appendChild(w);
  return;
  try{const d=await api('/api/payments',{method:'POST',body:{credits,reference:'PENDING'}});
  toast(d.note||'Submitted for confirmation.');}catch(e){toast(e.message)}
}
