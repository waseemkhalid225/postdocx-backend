<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PostDocX — Academic Career Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A41;--ink-2:#24354F;--paper:#F3F5F7;--panel:#fff;--slate:#5C6C7D;--line:#DCE2E8;--soft:#EDF0F3;
--gold:#B8912E;--gold-soft:#F6EFDC;--green:#23745A;--green-soft:#E3F0EA;--crimson:#B23A2E;--crimson-soft:#F7E6E3;
--blue:#2C5F9E;--blue-soft:#E6EEF7;--r:12px;--shadow:0 1px 3px rgba(27,42,65,.08),0 4px 14px rgba(27,42,65,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14.5px;line-height:1.5}
.mono{font-family:'IBM Plex Mono',monospace}
header{background:var(--ink);color:#F4F1E8;padding:14px 18px 0;position:sticky;top:0;z-index:40}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:0 auto}
.brand h1{font-family:'Fraunces',serif;font-weight:700;font-size:22px}.brand h1 .x{color:var(--gold)}
.uname{font-size:12.5px;color:#9FB0C3}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1180px;margin:12px auto 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:none;color:#9FB0C3;font:600 13px 'Inter',sans-serif;padding:10px 13px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:var(--gold)}
main{max-width:1180px;margin:0 auto;padding:18px 14px 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:4px}
.card .sub{color:var(--slate);font-size:12.5px;margin-bottom:12px}
.grid2{display:grid;gap:14px}@media(min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rail{display:flex;align-items:flex-start;overflow-x:auto;padding:6px 2px 2px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;text-align:center;min-width:86px;position:relative}
.st .n{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px}
.st .l{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--slate);margin-top:2px}
.st .dot{width:11px;height:11px;border-radius:50%;background:var(--line);margin:8px auto 0;border:2.5px solid var(--panel);box-shadow:0 0 0 1.5px var(--line)}
.st.hot .dot{background:var(--gold);box-shadow:0 0 0 1.5px var(--gold)}
.st::after{content:'';position:absolute;top:calc(100% - 13px);left:50%;width:100%;height:1.5px;background:var(--line);z-index:-1}
.st:last-child::after{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px 'Inter',sans-serif;padding:3px 9px;border-radius:99px;white-space:nowrap}
.c-gold{background:var(--gold-soft);color:#8A6A15}.c-green{background:var(--green-soft);color:var(--green)}
.c-red{background:var(--crimson-soft);color:var(--crimson)}.c-blue{background:var(--blue-soft);color:var(--blue)}
.c-gray{background:var(--soft);color:var(--slate)}
.score{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;padding:3px 8px;border-radius:6px}
.s90{background:var(--gold-soft);color:#8A6A15}.s80{background:var(--green-soft);color:var(--green)}
.s70{background:var(--blue-soft);color:var(--blue)}.s0{background:var(--soft);color:var(--slate)}
.item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
.item .t{font-weight:600;font-size:14.5px}.item .m{color:var(--slate);font-size:12.5px;margin-top:2px}
.item .b{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:26px 16px;text-align:center;color:var(--slate);font-size:13px}
button.btn{font:600 13px 'Inter',sans-serif;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid transparent}
.b-ink{background:var(--ink);color:#fff}.b-gold{background:var(--gold);color:#fff}
.b-line{background:#fff;color:var(--ink);border-color:var(--line)}
.b-green{background:var(--green);color:#fff}
.b-red{background:#fff;color:var(--crimson);border-color:var(--crimson-soft)}
.b-sm{padding:6px 10px;font-size:12px;border-radius:7px}
button:disabled{opacity:.5;cursor:default}
label{display:block;font:600 12px 'Inter',sans-serif;color:var(--slate);margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:400 14px 'Inter',sans-serif;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
textarea{min-height:80px;resize:vertical}
.auth-wrap{min-height:92vh;display:grid;place-items:center;padding:20px}
.auth{width:100%;max-width:520px}
.auth .logo{font-family:'Fraunces',serif;font-weight:700;font-size:34px;text-align:center;margin-bottom:4px}
.auth .logo .x{color:var(--gold)}
.auth .tag{text-align:center;color:var(--slate);font-size:13px;margin-bottom:22px}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line);font-style:normal}
.steps i.on{background:var(--gold)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font:600 13px 'Inter',sans-serif;box-shadow:var(--shadow);z-index:80;display:none;max-width:88vw;text-align:center}
#ovl{position:fixed;inset:0;background:rgba(27,42,65,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
@media(min-width:640px){#ovl{align-items:center}}
#ovl.open{display:flex}
#modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:680px;max-height:88vh;overflow-y:auto;padding:20px 18px 26px}
@media(min-width:640px){#modal{border-radius:16px}}
#modal h3{font-family:'Fraunces',serif;font-size:19px}
.dl{font-family:'IBM Plex Mono',monospace;font-size:11.5px}
pre.doc{white-space:pre-wrap;font:400 13.5px/1.65 'Inter',sans-serif;background:var(--soft);padding:14px;border-radius:10px;margin-top:10px}
a{color:var(--blue)}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
.checklist .item{padding:10px 14px}
.done{color:var(--green)}
</style>
</head>
<body>
<div id="app"></div>
<div id="ovl" onclick="if(event.target===this)closeModal()"><div id="modal"></div></div>
<div id="toast"></div>
<script>
/* ================= core ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3200)}
function daysLeft(d){if(!d)return null;return Math.ceil((new Date(d+'T23:59:59')-new Date())/86400000)}
function dlChip(d){const n=daysLeft(d);if(n===null)return '<span class="chip c-gray">no deadline</span>';
if(n<0)return '<span class="chip c-gray">expired</span>';
if(n<=7)return `<span class="chip c-red dl">D-${n}</span>`;
if(n<=21)return `<span class="chip c-gold dl">D-${n}</span>`;
return `<span class="chip c-gray dl">D-${n}</span>`}
function scoreChip(n){n=Number(n)||0;const c=n>=90?'s90':n>=80?'s80':n>=70?'s70':'s0';return `<span class="score ${c}">${n} / 100</span>`}
function stChip(s){const map={'VERIFIED':'c-green','NEEDS_VERIFICATION':'c-gold','EXPIRED':'c-gray','SENT':'c-blue','PENDING':'c-gold','APPROVED':'c-blue','REJECTED':'c-gray','NO_EMAIL':'c-red'};return `<span class="chip ${map[s]||'c-gray'}">${esc((s||'NEW').replace(/_/g,' ').toLowerCase())}</span>`}
function closeModal(){$('ovl').classList.remove('open')}
function modal(html){$('modal').innerHTML=html;$('ovl').classList.add('open')}

let TOKEN=localStorage.getItem('pdx_token')||'';
let ME=null, B=null, TAB='dash';

async function api(path,opts={}){
  const headers=opts.headers||{};
  if(TOKEN)headers['Authorization']='Bearer '+TOKEN;
  if(opts.body&&!(opts.body instanceof FormData))headers['Content-Type']='application/json';
  const res=await fetch(path,{...opts,headers,body:opts.body instanceof FormData?opts.body:(opts.body?JSON.stringify(opts.body):undefined)});
  const data=await res.json().catch(()=>({}));
  if(res.status===401){TOKEN='';localStorage.removeItem('pdx_token');renderAuth();throw new Error(data.error||'Signed out')}
  if(!res.ok)throw new Error(data.error||('Error '+res.status));
  return data;
}

/* ================= auth screens ================= */
const REG={};
function renderAuth(mode){
  document.querySelector('#app').innerHTML=`<div class="auth-wrap"><div class="auth">
  <div class="logo">PostDoc<span class="x">X</span></div>
  <div class="tag">Your academic career office. It searches, verifies and writes while you sleep.</div>
  <div class="card" id="authCard"></div></div></div>`;
  if(mode==='reg')regStep();else loginForm();
}
function loginForm(){
  $('authCard').innerHTML=`<h2>Sign in</h2><div class="sub">Welcome back</div>
  <label>Email</label><input id="li-email" type="email" autocomplete="email">
  <label>Password</label><input id="li-pass" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:16px"><button class="btn b-ink" style="flex:1" onclick="doLogin()">Sign in</button></div>
  <div class="sub" style="margin-top:14px;text-align:center">New researcher? <a href="#" onclick="regStep();return false">Create your account</a></div>`;
  $('li-pass').onkeydown=e=>{if(e.key==='Enter')doLogin()};
}
async function doLogin(){
  try{const d=await api('/api/login',{method:'POST',body:{email:$('li-email').value.trim(),password:$('li-pass').value}});
  TOKEN=d.token;localStorage.setItem('pdx_token',TOKEN);ME=d.user;boot();}catch(e){toast(e.message)}
}
function regStep(){
  $('authCard').innerHTML=`<h2>Create your account</h2><div class="sub">Just the basics. Everything else fills itself from your CV after you upload it.</div>
  <label>Full name (as used on publications)</label><input id="r-name" value="${esc(REG.name||'')}">
  <label>Email</label><input id="r-email" type="email" value="${esc(REG.email||'')}">
  <label>Password (8+ characters)</label><input id="r-pass" type="password">
  <label>Phone (optional)</label><input id="r-phone" value="${esc(REG.phone||'')}">
  <div class="row" style="margin-top:16px"><button class="btn b-ink" style="flex:1" onclick="regSave()">Create account</button></div>
  <div class="sub" style="margin-top:14px;text-align:center">Already registered? <a href="#" onclick="loginForm();return false">Sign in</a></div>`;
}
function regSave(){
  REG.name=$('r-name').value.trim();REG.email=$('r-email').value.trim();REG.password=$('r-pass').value;REG.phone=$('r-phone').value.trim();
  if(!REG.name||!REG.email||!REG.password)return toast('Name, email and password are required');
  if(REG.password.length<8)return toast('Password must be at least 8 characters');
  api('/api/register',{method:'POST',body:REG}).then(d=>{
    TOKEN=d.token;localStorage.setItem('pdx_token',TOKEN);ME=d.user;
    toast('Welcome, '+ME.name.split(' ')[0]+'. Now upload your CV and watch the profile fill itself.');boot('onboard');
  }).catch(e=>toast(e.message));
}

/* ================= app shell ================= */
const TABS=[['dash','Dashboard'],['cases','Cases'],['opps','Opportunities'],['couple','Couple'],['outbox','Outbox'],['docs','Documents'],['refs','Referees'],['props','Proposals'],['profile','Profile']];
function shell(){
  const isAdmin=ME&&ME.role==='admin';
  const tabs=[...TABS,...(isAdmin?[['admin','Admin']]:[])];
  document.querySelector('#app').innerHTML=`<header><div class="brand-row">
  <div class="brand"><h1>PostDoc<span class="x">X</span></h1></div>
  <div style="text-align:right"><div class="uname">${esc(ME.name)}${isAdmin?' · admin':''}</div>
  <a href="#" style="color:#9FB0C3;font-size:11.5px" onclick="logout();return false">Sign out</a></div></div>
  <nav>${tabs.map(([id,l])=>`<button id="nb-${id}" onclick="go('${id}')">${l}</button>`).join('')}</nav></header>
  <main id="view"></main>`;
}
function logout(){TOKEN='';localStorage.removeItem('pdx_token');ME=null;B=null;renderAuth()}
function go(t){TAB=t;render()}
async function boot(first){
  if(!TOKEN)return renderAuth();
  try{
    if(!ME)ME=(await api('/api/me')).user;
    shell();
    if(first==='onboard'){TAB='docs';}
    await refresh();
  }catch(e){/* auth handler already redirected */}
}
async function refresh(){
  try{B=await api('/api/bundle');ME=B.me;}catch(e){toast(e.message)}
  render();
}
function render(){
  if(!ME)return;
  TABS.concat([['admin','Admin']]).forEach(([id])=>{const b=$('nb-'+id);if(b)b.className=id===TAB?'on':''});
  const V={dash:vDash,cases:vCases,opps:vOpps,couple:vCouple,outbox:vOutbox,docs:vDocs,refs:vRefs,props:vProps,profile:vProfile,admin:vAdmin};
  (V[TAB]||vDash)();
}

/* ================= onboarding checklist ================= */
const REQUIRED_DOCS=['CV','Research statement','Degree certificates','Transcripts','Publication PDFs','Passport / ID'];
let DOCS=[],REFS=[];
function checklist(){
  const have=new Set(DOCS.map(d=>d.type));
  const items=[
    ...REQUIRED_DOCS.map(t=>({ok:have.has(t),label:t+' uploaded',tab:'docs'})),
    {ok:!!(ME.field&&ME.methods&&ME.pubs),label:DOCS.length?'Profile extracted, review it once':'Profile (fills itself from your CV upload)',tab:DOCS.length?'profile':'docs'},
    {ok:ME.emailConnected,label:'Your Gmail connected (send and reply detection from your own address)',tab:'profile'},
    {ok:REFS.length>=2,label:'At least two referees added',tab:'refs'}
  ];
  const done=items.filter(i=>i.ok).length;
  return {items,done,total:items.length,pct:Math.round(100*done/items.length)};
}

/* ================= views ================= */
function pendingN(out){return out.filter(m=>m.status==='PENDING').length}
function vDash(){
  const o=B?B.opportunities:[],out=B?B.outbox:[];
  const verified=o.filter(x=>x.status==='VERIFIED'),high=o.filter(x=>(+x.matchScore||0)>=80&&x.status!=='EXPIRED');
  const sent=out.filter(m=>m.status==='SENT'),replied=out.filter(m=>m.replied==='yes'),pending=out.filter(m=>m.status==='PENDING');
  const cases=B&&B.cases?B.cases:[];
  const readyCases=cases.filter(c=>c.stage==='Email prepared'||c.stage==='Awaiting approval');
  const activeCases=cases.filter(c=>c.status==='ACTIVE');
  const coupleN=o.filter(x=>x.coupleKey).length;
  const rail=[['Discover',o.length],['Verify',verified.length],['Cases',activeCases.length],['Ready',readyCases.length+pendingN(out)],['Sent',sent.length],['Replies',replied.length],['Couple',coupleN]];
  const dls=o.filter(x=>x.deadline&&daysLeft(x.deadline)>=0).sort((a,b)=>a.deadline<b.deadline?-1:1).slice(0,6);
  const cl=checklist();
  $('view').innerHTML=`
  ${cl.pct<100?`<div class="card"><div class="spread"><div><h2>Finish your setup, ${esc(ME.name.split(' ')[0])}</h2>
  <div class="sub">${cl.done} of ${cl.total} done. The agent works best with everything in place.</div></div>
  <span class="chip ${cl.pct>=70?'c-gold':'c-red'}">${cl.pct}% ready</span></div>
  <div class="checklist">${cl.items.filter(i=>!i.ok).slice(0,4).map(i=>`<div class="item spread"><span>${esc(i.label)}</span>
  <button class="btn b-line b-sm" onclick="go('${i.tab}')">Do it</button></div>`).join('')}</div></div>`:''}
  <div class="card"><div class="spread"><div><h2>Your pipeline</h2><div class="sub">${B&&B.partner?'Couple-linked with '+esc(B.partner.name)+' · ':''}The agent runs every morning and evening</div></div></div>
  <div class="rail">${rail.map(([l,n])=>`<div class="st ${n>0?'hot':''}"><div class="n">${n}</div><div class="l">${l}</div><div class="dot"></div></div>`).join('')}</div></div>
  ${pending.length?`<div class="card"><h2>Waiting for your approval</h2><div class="sub">These emails will not send until you approve them</div>
  ${pending.slice(0,3).map(outRow).join('')}
  ${pending.length>3?`<button class="btn b-line b-sm" onclick="go('outbox')">See all ${pending.length}</button>`:''}</div>`:''}
  <div class="grid2">
  <div class="card"><h2>Upcoming deadlines</h2><div class="sub">Back-planned from D-21</div>
  ${dls.length?dls.map(x=>`<div class="item spread"><div><div class="t">${esc(x.title)}</div><div class="m">${esc(x.institution)}</div></div>${dlChip(x.deadline)}</div>`).join(''):'<div class="empty">No live deadlines yet. New finds arrive with the morning cycle.</div>'}</div>
  <div class="card"><h2>Top matches</h2><div class="sub">Score 80+, strong or exceptional fit</div>
  ${high.length?high.sort((a,b)=>(+b.matchScore)-(+a.matchScore)).slice(0,4).map(oppRow).join(''):'<div class="empty">Nothing scored 80+ yet.</div>'}</div>
  </div>`;
  loadSide();
}
async function loadSide(){try{DOCS=(await api('/api/documents')).documents;REFS=(await api('/api/referees')).referees;if(TAB==='dash')renderChecklistOnly();}catch(e){}}
function renderChecklistOnly(){/* checklist card refreshes on next render; keep light */}


const CASE_STAGES=['Discovered','Verified','Email prepared','Awaiting approval','Sent','Replied','In conversation','Interview','Closed'];
function vCases(){
  const cases=(B&&B.cases?B.cases:[]).sort((a,b)=>(b.updatedOn||'')<(a.updatedOn||'')?-1:1);
  const opps=B?B.opportunities:[];
  const threads=B&&B.threads?B.threads:[];
  $('view').innerHTML=`<div class="card"><h2>Cases</h2>
  <div class="sub">Every strong verified match becomes a case automatically and moves through the pipeline. You only step in where the timeline says so.</div>
  ${cases.length?cases.map(c=>{
    const o=opps.find(x=>x.id===c.oppId)||{};
    const idx=Math.max(0,CASE_STAGES.indexOf(c.stage));
    const th=threads.filter(t=>t.oppId===c.oppId);
    return `<div class="item">
    <div class="spread"><div style="min-width:0"><div class="t"><span class="mono" style="color:var(--gold)">${esc(c.caseNo)}</span> ${esc(o.title||'')}</div>
    <div class="m">${esc(o.institution||'')}${o.pi?' · PI: '+esc(o.pi):''}${o.country?' · '+esc(o.country):''}</div></div>
    ${scoreChip(c.matchScore)}</div>
    <div class="rail" style="margin-top:8px">${CASE_STAGES.map((st,i)=>`<div class="st ${i<=idx?'hot':''}" style="min-width:72px"><div class="l" style="margin-top:0">${st}</div><div class="dot"></div></div>`).join('')}</div>
    ${c.nextAction?`<div class="m" style="margin-top:8px"><b>Next:</b> ${esc(c.nextAction)}</div>`:''}
    ${c.outcome?`<div class="m" style="margin-top:4px;color:var(--crimson)">Outcome: ${esc(c.outcome)}</div>`:''}
    ${th.length?`<div class="m" style="margin-top:6px"><b>Latest from supervisor</b> (${esc(th[th.length-1].intent||'')}): ${esc((th[th.length-1].body||'').slice(0,180))}…</div>`:''}
    <div class="b">
    ${o.deadline?dlChip(o.deadline):''}
    <button class="btn b-line b-sm" onclick="gen('cv','${c.oppId}')">Tailored CV</button>
    <button class="btn b-line b-sm" onclick="gen('proposal','${c.oppId}')">Concept note</button>
    <button class="btn b-line b-sm" onclick="gen('interview','${c.oppId}')">Interview brief</button>
    ${c.coupleKey?`<button class="btn b-line b-sm" onclick="gen('dossier','${c.oppId}')">Two-body dossier</button>`:''}
    ${o.url?`<a href="${esc(o.url)}" target="_blank" rel="noopener" class="chip c-blue">source ↗</a>`:''}
    </div></div>`}).join(''):'<div class="empty">No cases yet. When the agent verifies an 80+ match, a case opens here automatically and starts moving.</div>'}</div>`;
}

function oppRow(o){
  return `<div class="item"><div class="spread"><div style="min-width:0"><div class="t">${esc(o.title)}</div>
  <div class="m">${esc(o.institution)}${o.country?' · '+esc(o.country):''}${o.pi?' · PI: '+esc(o.pi):''}</div></div>${scoreChip(o.matchScore)}</div>
  <div class="b">${stChip(o.status)}<span class="chip c-gray">${esc(o.funding||'Funding TBC')}</span>${dlChip(o.deadline)}
  ${o.url?`<a href="${esc(o.url)}" target="_blank" rel="noopener" class="chip c-blue">source ↗</a>`:''}
  ${o.coupleKey?'<span class="chip c-gold">couple</span>':''}</div>
  <div class="b">
  <button class="btn b-line b-sm" onclick="gen('cv','${o.id}')">Tailored CV</button>
  <button class="btn b-line b-sm" onclick="gen('proposal','${o.id}')">Concept note</button>
  <button class="btn b-line b-sm" onclick="gen('interview','${o.id}')">Interview brief</button>
  ${o.coupleKey?`<button class="btn b-line b-sm" onclick="gen('dossier','${o.id}')">Two-body dossier</button>`:''}
  ${o.note?`<button class="btn b-line b-sm" onclick="modal('<h3>Notes</h3><pre class=doc>${esc(o.note).replace(/'/g,'&#39;')}</pre><div class=b style=margin-top:12px><button class=\\'btn b-line\\' onclick=closeModal()>Close</button></div>')">Details</button>`:''}
  </div></div>`;
}
async function gen(kind,id){
  try{const d=await api('/api/generate/'+kind+'/'+id,{method:'POST'});toast(d.message)}catch(e){toast(e.message)}
}
function vOpps(){
  const o=(B?B.opportunities:[]).sort((a,b)=>(+b.matchScore||0)-(+a.matchScore||0));
  $('view').innerHTML=`<div class="card"><div class="spread"><div><h2>Opportunities</h2>
  <div class="sub">${o.length} found for you. Every item is verified against its original institutional source before any contact.</div></div>
  <button class="btn b-line" onclick="refresh()">Refresh</button></div>
  ${o.length?o.map(oppRow).join(''):'<div class="empty">The agent has not found anything yet. New discoveries land every morning at 6 AM, evenings pick up approvals and replies.</div>'}</div>`;
}
function vCouple(){
  const mine=(B?B.opportunities:[]).filter(o=>o.coupleKey);
  const theirs=B?B.coupleOpportunities:[];
  const groups={};
  [...mine,...theirs].forEach(o=>{(groups[o.coupleKey]=groups[o.coupleKey]||[]).push(o)});
  const keys=Object.keys(groups);
  $('view').innerHTML=`<div class="card"><h2>Couple placement</h2>
  <div class="sub">${B&&B.partner?'Scenarios where you and '+esc(B.partner.name)+' can be placed together: same university, same city, or one funded role plus one hostable route nearby.':'Ask the admin to link your accounts as a couple, then scenarios appear here.'}</div>
  ${keys.length?keys.map(k=>`<div class="item"><div class="t" style="margin-bottom:6px">Scenario: ${esc(k.split('-').pop())}</div>
  ${groups[k].map(o=>`<div class="m" style="margin:6px 0 2px"><b>${o.resId===ME.id?'You':'Partner'}:</b> ${esc(o.title)}, ${esc(o.institution)} ${scoreChip(o.matchScore)} ${stChip(o.status)}</div>`).join('')}
  <div class="b">${groups[k].filter(o=>o.resId===ME.id).map(o=>`<button class="btn b-line b-sm" onclick="gen('dossier','${o.id}')">Generate two-body dossier</button>`).join('')}</div>
  </div>`).join(''):'<div class="empty">No couple scenarios yet. They are searched every morning when both partners are linked.</div>'}</div>`;
}
function outRow(m){
  const th=(B&&B.threads?B.threads:[]).filter(t=>t.outboxId===m.id||((m.type==='reply')&&t.oppId===m.oppId));
  const lastTh=th[th.length-1];
  return `<div class="item">${m.type==='reply'&&lastTh?`<div class="m" style="margin-bottom:8px;padding:9px 11px;background:var(--soft);border-radius:8px"><b>${esc(lastTh.fromEmail)} wrote</b> (${esc(lastTh.intent||'')}): ${esc((lastTh.body||'').slice(0,300))}${(lastTh.body||'').length>300?'…':''}</div>`:''}
  <div class="spread"><div style="min-width:0"><div class="t">${esc(m.subject)}</div>
  <div class="m">To ${esc(m.toName)} &lt;${esc(m.toEmail||'no address yet')}&gt; · ${esc(m.type)}${m.sentOn?' · sent '+esc(m.sentOn):''}${m.replied==='yes'?' · <b class="done">replied ✓</b>':''}</div></div>${stChip(m.status)}</div>
  <div class="b">
  <button class="btn b-line b-sm" onclick="modal('<h3>${esc(m.subject).replace(/'/g,'&#39;')}</h3><pre class=doc>${esc(m.body).replace(/'/g,'&#39;')}</pre><div class=b style=margin-top:12px><button class=\\'btn b-line\\' onclick=closeModal()>Close</button></div>')">Read</button>
  ${m.status==='PENDING'?`<button class="btn b-green b-sm" onclick="act('${m.id}','approve')">Approve, send it</button>
  <button class="btn b-red b-sm" onclick="act('${m.id}','reject')">Reject</button>`:''}
  </div></div>`;
}
async function act(id,action){
  try{await api('/api/outbox/'+id+'/'+action,{method:'POST'});toast(action==='approve'?'Approved. It sends within the next cycle.':'Rejected, it will not send.');await refresh()}catch(e){toast(e.message)}
}
function vOutbox(){
  const out=B?B.outbox:[];
  const pending=out.filter(m=>m.status==='PENDING'),rest=out.filter(m=>m.status!=='PENDING');
  $('view').innerHTML=`<div class="card"><h2>Outbox</h2>
  <div class="sub">Everything the agent drafts on your behalf. Nothing sends without approval unless auto mode is enabled by the admin.</div>
  ${pending.length?'<b style="font-size:13px">Awaiting your decision</b>'+pending.map(outRow).join(''):''}
  ${rest.length?'<b style="font-size:13px">History</b>'+rest.map(outRow).join(''):''}
  ${!out.length?'<div class="empty">No correspondence yet. When the agent verifies a strong match it drafts the first email and asks you here.</div>':''}</div>`;
}
const DOC_TYPES=['CV','Research statement','Degree certificates','Transcripts','Publication PDFs','Reference letters','Passport / ID','Cover letter template','Certificates (awards, training)','Other'];
function vDocs(){
  api('/api/documents').then(d=>{DOCS=d.documents;
  const have=new Set(DOCS.map(x=>x.type));
  const missing=REQUIRED_DOCS.filter(t=>!have.has(t));
  $('view').innerHTML=`<div class="card"><h2>Your documents</h2>
  <div class="sub">${missing.length?'Still needed: '+missing.join(', '):'Everything an application needs is on file ✓'} Files are stored privately, streamed only to you, and attached to outreach when you mark them.</div>
  ${DOCS.length?DOCS.map(x=>`<div class="item spread"><div><div class="t">${esc(x.type)}${x.name?': '+esc(x.name):''}</div>
  <div class="m">${esc(x.updatedOn)} · ${Math.round((+x.size||0)/1024)} KB ${x.attach==='yes'?'· attaches to outreach':''}</div></div>
  <div class="row"><a class="btn b-line b-sm" href="#" onclick="dlDoc('${x.id}');return false">View</a>
  <button class="btn b-red b-sm" onclick="delDoc('${x.id}')">Remove</button></div></div>`).join(''):'<div class="empty">Start with your CV. The moment it uploads, PostDocX reads it and fills your academic profile automatically.</div>'}
  <hr class="sep"><b style="font-size:13px">Upload a document</b>
  <label>Type</label><select id="up-type">${DOC_TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
  <label>Label (version note)</label><input id="up-name" placeholder="e.g. CV academic v6, March 2026">
  <label>File (PDF, Word or image, up to 15 MB)</label><input id="up-file" type="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg">
  <label>Attach to outreach emails? (recommended for CV)</label>
  <select id="up-attach"><option value="no">No</option><option value="yes">Yes, attach</option></select>
  <div class="b" style="margin-top:14px"><button class="btn b-ink" id="upBtn" onclick="upload()">Upload</button></div></div>`;
  }).catch(e=>toast(e.message));
}
async function upload(){
  const f=$('up-file').files[0];if(!f)return toast('Choose a file first');
  const fd=new FormData();fd.append('file',f);fd.append('type',$('up-type').value);fd.append('name',$('up-name').value);fd.append('attach',$('up-attach').value);
  $('upBtn').disabled=true;toast('Uploading '+f.name+'…');
  try{
    await api('/api/documents',{method:'POST',body:fd});
    toast('Uploaded ✓ Reading it now…');
    vDocs();
    try{
      const r=await api('/api/profile/autofill',{method:'POST',body:{}});
      ME=r.user;
      if(r.filled&&r.filled.length)toast('Profile filled from your documents ('+r.filled.join(', ')+'). Review it in Profile.');
    }catch(e){/* autofill is best-effort */}
  }catch(e){toast(e.message)}
  $('upBtn').disabled=false;
}
async function dlDoc(id){
  try{const res=await fetch('/api/documents/'+id+'/download',{headers:{Authorization:'Bearer '+TOKEN}});
  if(!res.ok)throw new Error('Could not open file');
  const blob=await res.blob();window.open(URL.createObjectURL(blob),'_blank');}catch(e){toast(e.message)}
}
async function delDoc(id){if(!confirm('Remove this document?'))return;
  try{await api('/api/documents/'+id,{method:'DELETE'});vDocs()}catch(e){toast(e.message)}}
function vRefs(){
  api('/api/referees').then(d=>{REFS=d.referees;
  $('view').innerHTML=`<div class="card"><div class="spread"><div><h2>Referees</h2>
  <div class="sub">The agent reminds you to chase them when any deadline is within 12 days, and can draft warm request emails for your approval.</div></div>
  ${REFS.some(r=>r.status!=='confirmed')?`<button class="btn b-gold" onclick="reqRefs()">Draft request emails</button>`:''}</div>
  ${REFS.length?REFS.map(r=>`<div class="item spread"><div><div class="t">${esc(r.name)}</div>
  <div class="m">${esc(r.email)} · ${esc(r.relationship||'')} · ${esc(r.status)}</div></div>
  <button class="btn b-red b-sm" onclick="delRef('${r.id}')">Remove</button></div>`).join(''):'<div class="empty">Add at least two referees, ideally your PhD supervisor and a co-author.</div>'}
  <hr class="sep"><b style="font-size:13px">Add a referee</b>
  <label>Name</label><input id="rf-name"><label>Email</label><input id="rf-email">
  <label>Relationship</label><input id="rf-rel" placeholder="e.g. PhD supervisor, Riphah International University">
  <div class="b" style="margin-top:14px"><button class="btn b-ink" onclick="addRef()">Add referee</button></div></div>`;
  }).catch(e=>toast(e.message));
}
async function addRef(){try{await api('/api/referees',{method:'POST',body:{name:$('rf-name').value.trim(),email:$('rf-email').value.trim(),relationship:$('rf-rel').value.trim()}});vRefs()}catch(e){toast(e.message)}}
async function delRef(id){try{await api('/api/referees/'+id,{method:'DELETE'});vRefs()}catch(e){toast(e.message)}}
async function reqRefs(){try{const d=await api('/api/referees/request-all',{method:'POST'});toast(d.drafted+' request(s) drafted, approve them in your Outbox')}catch(e){toast(e.message)}}
function vProps(){
  const p=B?B.proposals:[];
  $('view').innerHTML=`<div class="card"><h2>Proposals and briefings</h2>
  <div class="sub">Concept notes, interview briefings and dossiers written for you. Read, edit, and make each one yours before it is used.</div>
  ${p.length?p.map(x=>`<div class="item spread"><div><div class="t">${esc(x.title)}</div><div class="m">${esc(x.createdOn)} · ${esc(x.status)}</div></div>
  <button class="btn b-line b-sm" onclick="openProp('${x.id}')">Read</button></div>`).join(''):'<div class="empty">Nothing yet. Open an opportunity and tap Concept note or Interview brief.</div>'}</div>`;
}
async function openProp(id){
  try{const d=await api('/api/proposals/'+id);
  modal(`<h3>${esc(d.title)}</h3><div class="sub">${esc(d.createdOn)}</div><pre class="doc">${esc(d.content)}</pre>
  <div class="b" style="margin-top:12px"><button class="btn b-ink" onclick="navigator.clipboard.writeText(document.querySelector('pre.doc').innerText).then(()=>toast('Copied'))">Copy</button>
  <button class="btn b-line" onclick="closeModal()">Close</button></div>`)}catch(e){toast(e.message)}
}
let EDIT_PROFILE=false;
const PROFILE_FIELDS=[['title','Credentials and role'],['field','Research field'],['methods','Methods and techniques'],['pubs','Publications'],['orcid','ORCID'],['links','Academic links'],['prefs','Preferences (countries, funding, couple placement)']];
function vProfile(){
  const missing=PROFILE_FIELDS.filter(([k])=>!String(ME[k]||'').trim());
  $('view').innerHTML=`<div class="grid2"><div class="card"><div class="spread"><div><h2>Academic profile</h2>
  <div class="sub">${missing.length?'Extracted from your documents. '+missing.length+' field(s) still missing, fill them below or upload more documents.':'Extracted from your documents and complete ✓ Everything the agent writes is built from these facts.'}</div></div>
  <div class="row">${!EDIT_PROFILE?`<button class="btn b-line b-sm" onclick="EDIT_PROFILE=true;render()">Edit</button>`:''}
  <button class="btn b-line b-sm" onclick="autofill()">Re-read documents</button></div></div>
  ${EDIT_PROFILE?`
    <label>Full name</label><input id="p-name" value="${esc(ME.name)}">
    ${PROFILE_FIELDS.map(([k,l])=>`<label>${l}</label>${k==='title'||k==='orcid'?`<input id="p-${k}" value="${esc(ME[k]||'')}">`:`<textarea id="p-${k}">${esc(ME[k]||'')}</textarea>`}`).join('')}
    <div class="b" style="margin-top:12px"><button class="btn b-ink" onclick="saveProfile()">Save profile</button>
    <button class="btn b-line" onclick="EDIT_PROFILE=false;render()">Cancel</button></div>`
  :`
    ${PROFILE_FIELDS.map(([k,l])=>{
      const v=String(ME[k]||'').trim();
      if(v)return `<div class="item"><div class="m" style="font-weight:600;color:var(--slate)">${l}</div><div style="margin-top:3px;white-space:pre-wrap">${esc(v)}</div></div>`;
      return `<div class="item" style="border-color:var(--gold)"><div class="m" style="font-weight:600;color:#8A6A15">${l} — missing</div>
      ${k==='title'||k==='orcid'?`<input id="pm-${k}" placeholder="Fill in, or upload a document that contains it">`:`<textarea id="pm-${k}" style="min-height:56px" placeholder="Fill in, or upload a document that contains it"></textarea>`}</div>`;
    }).join('')}
    ${missing.length?`<div class="b" style="margin-top:6px"><button class="btn b-ink" onclick="saveMissing()">Save missing fields</button></div>`:''}`}
  </div>
  <div class="card"><h2>Your email</h2>
  <div class="sub">${ME.emailMode==='yes'?'Connected fully ✓ Outreach sends from your own Gmail and replies are detected in your inbox.':ME.emailMode==='imap'?'Connected for reading ✓ Your inbox replies are detected. Direct sending from your address is blocked by the hosting network, so outreach goes through the office account with Reply-To set to you.':'Connect your Gmail so professors receive emails from you and replies are detected automatically.'}</div>
  ${ME.emailConnected?`<div class="b"><button class="btn b-red" onclick="disconnectEmail()">Disconnect</button></div>`:`
  <div class="m" style="margin-bottom:8px">Two minutes, one time: at myaccount.google.com turn ON 2-Step Verification first, then search "App passwords", create one named PostDocX, paste the 16 characters here. Regular Gmail passwords never work. Stored encrypted, never shown to anyone.</div>
  <label>Gmail address</label><input id="em-user" placeholder="you@gmail.com" value="${esc(ME.email)}">
  <label>App password (16 characters)</label><input id="em-pass" type="password">
  <div class="b" style="margin-top:12px"><button class="btn b-ink" id="emBtn" onclick="connectEmail()">Test connection</button></div>`}
  </div></div>`;
}
async function saveMissing(){
  const body={};let n=0;
  PROFILE_FIELDS.forEach(([k])=>{const el=$('pm-'+k);if(el&&el.value.trim()){body[k]=el.value.trim();n++}});
  if(!n)return toast('Nothing to save yet');
  try{const d=await api('/api/profile',{method:'PUT',body});ME=d.user;toast('Saved');render()}catch(e){toast(e.message)}
}
async function saveProfile(){
  try{const body={name:$('p-name').value.trim()};PROFILE_FIELDS.forEach(([k])=>body[k]=$('p-'+k).value.trim());
  const d=await api('/api/profile',{method:'PUT',body});ME=d.user;EDIT_PROFILE=false;toast('Profile saved');shell();render()}catch(e){toast(e.message)}
}
async function connectEmail(){
  const btn=$('emBtn');btn.disabled=true;btn.textContent='Testing with Gmail (up to 30s)…';
  try{
    const d=await api('/api/email-connect',{method:'POST',body:{gmail:$('em-user').value.trim(),appPassword:$('em-pass').value}});
    ME.emailConnected=true;ME.emailMode=d.mode;toast(d.message||'Connected ✓');render();
  }catch(e){toast(e.message);btn.disabled=false;btn.textContent='Test connection';}
}
async function disconnectEmail(){try{await api('/api/email-disconnect',{method:'POST'});ME.emailConnected=false;render()}catch(e){toast(e.message)}}
function vAdmin(){
  api('/api/admin/users').then(d=>{
  const users=d.users;
  $('view').innerHTML=`<div class="card"><div class="spread"><div><h2>Admin</h2><div class="sub">${users.length} registered researchers</div></div>
  <div class="row"><button class="btn b-gold" onclick="adminRun()">Run full cycle now</button>
  <button class="btn b-line" onclick="adminWeekly()">Weekly review now</button></div></div>
  ${users.map(u=>`<div class="item spread"><div><div class="t">${esc(u.name)} ${u.role==='admin'?'<span class="chip c-gold">admin</span>':''}</div>
  <div class="m">${esc(u.email)} · ${u.emailConnected?'email connected ✓':'email not connected'}${u.partnerId?' · couple-linked':''}</div></div></div>`).join('')}
  <hr class="sep"><b style="font-size:13px">Link a couple</b>
  <div class="sub">Both pipelines then also search for co-located placements every morning</div>
  <label>Researcher A</label><select id="cp-a">${users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
  <label>Researcher B</label><select id="cp-b">${users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
  <div class="b" style="margin-top:12px"><button class="btn b-ink" onclick="linkCouple()">Link as couple</button>
  <button class="btn b-line" onclick="unlinkCouple()">Unlink A</button></div></div>`;
  }).catch(e=>toast(e.message));
}
async function linkCouple(){try{await api('/api/admin/link-couple',{method:'POST',body:{a:$('cp-a').value,b:$('cp-b').value}});toast('Couple linked, co-location search starts next cycle');vAdmin()}catch(e){toast(e.message)}}
async function unlinkCouple(){try{await api('/api/admin/unlink-couple',{method:'POST',body:{a:$('cp-a').value}});toast('Unlinked');vAdmin()}catch(e){toast(e.message)}}
async function adminRun(){try{const d=await api('/api/admin/run',{method:'POST'});toast(d.message)}catch(e){toast(e.message)}}
async function adminWeekly(){try{const d=await api('/api/admin/weekly',{method:'POST'});toast(d.message)}catch(e){toast(e.message)}}

/* ================= start ================= */
if(TOKEN)boot();else renderAuth();
</script>
</body>
</html>
