      +((dx.skills_verbatim||[]).length?1:0)+((ME.education||[]).length?1:0)
      +((ME.experience||[]).length?1:0)+((ME.publications||[]).length?1:0);};
  const finish=(n)=>{
    window._extracting=false;clearInterval(iv);
    toast(n>0?('Profile ready · '+n+' details read from your documents.')
             :'Documents saved. Open Profile to check and complete your details.');
    if(TAB==='home')vHome();if(TAB==='profile')vProfile();
  };
  const iv=setInterval(async()=>{
    tries++;
    try{
      const d=await api('/api/me');ME=d.me;
      const n=count();
      // Show live progress rather than a silent wait.
      const el=document.getElementById('uploadProgress');
      if(el)el.innerHTML='<div class="sub" style="padding:6px 0">Reading your documents… '+n+' details found so far</div>';
      if(n>0&&n===last){stable++}else{stable=0}
      last=n;
      // Settled: no new detail across two checks, and we have something real.
      if((stable>=2&&n>=6)||tries>=30){const el2=document.getElementById('uploadProgress');if(el2)el2.innerHTML='';finish(n)}
    }catch(e){if(tries>=30){const el2=document.getElementById('uploadProgress');if(el2)el2.innerHTML='';finish(last>0?last:0)}}
  },4000);
  setTimeout(()=>{if(TAB==='home')vHome()},700)};
  const upKind=window._uploadKind||null;
  const files=$('doc-files').files;

    });

}

  const V=[null,
   {size:21,cap:14,ec:10,blocks:[[1,26,16]]},
   {size:25,cap:26,ec:16,blocks:[[1,44,28]]},
   {size:29,cap:42,ec:26,blocks:[[1,70,44]]},
   {size:33,cap:62,ec:18,blocks:[[2,50,32]]},
   {size:37,cap:84,ec:24,blocks:[[2,64,43]]},
   {size:41,cap:106,ec:16,blocks:[[4,43,27]]},
   {size:45,cap:122,ec:18,blocks:[[4,49,31]]},
   {size:49,cap:152,ec:22,blocks:[[2,60,38],[2,61,39]]}];
  const ALIGN=[[],[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42]];

    let v=1;while(v<V.length&&bytes.length>V[v].cap)v++;

    for(let i=0;i<maxE;i++)for(const b of eBlocks)if(i<b.length)final.push(b[i]);

    const fn=Array.from({length:size},()=>new Array(size).fill(false));
    const finder=(r,c)=>{for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){const y=r+i,x=c+j;
      if(y<0||x<0||y>=size||x>=size)continue;fn[y][x]=true;

      m[y][x]=on?1:0}};

    for(let i=9;i<15;i++)m[14-i][8]=fbits[i];

    for(let i=8;i<15;i++)m[8][size-15+i]=fbits[i];
    m[8][size-8]=fbits[7];   // the cell adjoining the top-right finder, otherwise left unset
    m[size-8][8]=1;
    return m;
  }

})();

window.addEventListener('ff:api-402',e=>{try{const d=e.detail||{};if(d.offer==='package'){toast(d.error||'Choose a package to continue');setTimeout(()=>go('buy'),900)}}catch(x){}});
async function feeBoxLoad(credits){try{const q=await api('/api/pay/quote?credits='+credits);const el=$('feeBox');if(!el)return;el.innerHTML=`<b style="color:#EAF2FF">${q.local?esc(q.local.currency)+' '+Number(q.local.amount).toLocaleString()+' <span class="sub" style="font-weight:500">≈ $'+q.amount_usd+', charged in USD</span>':'$'+q.amount_usd}</b><br><b>Non-refundable:</b> ${esc(q.fees.non_refundable)} · <b>Refundable:</b> ${esc(q.fees.refundable)}<br><b>Not ours:</b> ${esc(q.fees.not_ours)}<br><span style="opacity:.8">${esc(q.tax)}</span>`}catch(e){}}
async function payPkLocal(credits,btn){const l=btn.textContent;btn.disabled=true;btn.textContent='Opening PKR checkout…';try{const d=await api('/api/pay/pk/checkout',{method:'POST',body:{credits:Number(credits)}});if(d&&d.url){location.href=d.url;return}throw new Error('Checkout could not start')}catch(e){toast(e.message);btn.disabled=false;btn.textContent=l}}
async function payByCard(credits,btn){
  const label=btn?btn.textContent:'';if(btn){btn.disabled=true;btn.textContent='Opening secure checkout\u2026'}
  try{const prov=((SITE||{}).gateway||{}).provider;const d=await api(prov==='lemonsqueezy'?'/api/pay/lemon/checkout':'/api/pay/checkout',{method:'POST',body:{credits:Number(credits)}});if(d&&d.url){location.href=d.url;return}throw new Error('Checkout could not start');}
  catch(e){toast(e.message);if(btn){btn.disabled=false;btn.textContent=label}}
}
/* Back from the card page: confirm with the server (never the URL), then open the matches. */
async function settleCardReturn(){
  try{
    const u=new URL(location.href);const paid=u.searchParams.get('paid'),sid=u.searchParams.get('session'),kind=u.searchParams.get('kind');
    if(paid==null)return;history.replaceState(null,'',location.pathname);
    if(kind==='agency'&&sid){const orgId=localStorage.getItem('ffSubOrg');if(orgId){toast('Confirming your agency plan\u2026');const r=await api('/api/org/'+orgId+'/subscription/confirm',{method:'POST',body:{session:sid}});if(r&&r.ok){toast('\u2713 Plan active until '+String(r.period_end||'').slice(0,10));window._orgId=orgId;go('work');setTimeout(billingPanel,600);}else toast('Plan not confirmed yet; it activates automatically when the payment clears.');}return;}
    if(paid==='1'&&u.searchParams.get('provider')==='safepay'){toast('Payment received. Your cases activate automatically within a minute.');watchPayment('safepay');return;}
    if(paid==='1'&&u.searchParams.get('provider')==='lemon'){toast('Payment received. Your cases activate automatically within a minute.');watchPayment('lemon');return;}
    if(paid==='1'&&sid){
      toast('Confirming your card payment\u2026');
      const r=await api('/api/pay/confirm',{method:'POST',body:{session:sid}});
      if(r&&r.ok){window._homeCache=null;HM=null;cacheClear();await refreshCredits();toast('\u2713 Paid. '+(r.balance!=null?r.balance+' cases active. ':'')+'Opening your matches\u2026');
        if(window._lastMatches){go('home');setTimeout(()=>showMatches(window._lastMatches.kind,Object.assign({},window._lastMatches.opts||{})),150)}else go('home');}
      else{toast('Payment not confirmed yet. If your bank shows it charged, it activates automatically within minutes.');watchPayment('card');}
    }else if(paid==='0'){toast('Card payment cancelled. You can try again or pay by bank transfer.');}
  }catch(e){toast(e.message)}
}
/* The screenshot is read on the phone, shrunk to a size the network forgives, and shown
   back so the customer knows the right picture is attached before they send it. */
window._payShot=null;
function payShotPicked(inp){
  const f=inp&&inp.files&&inp.files[0];if(!f)return;
  const box=document.getElementById('payShotBox'),send=document.getElementById('payShotSend');
  if(box)box.innerHTML='<div class="sub">Reading your screenshot\u2026</div>';
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const MAX=1280;let w=img.width,h=img.height;const sc=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
        const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        let q=0.84,out=c.toDataURL('image/jpeg',q);
        while(out.length>1500000&&q>0.4){q-=0.12;out=c.toDataURL('image/jpeg',q)}
        window._payShot={b64:out,name:f.name||'screenshot.jpg'};
        if(box)box.innerHTML='<img src="'+out+'" style="max-height:220px;max-width:100%;border-radius:8px;border:1px solid rgba(140,178,255,.3)"><div class="sub" style="margin-top:6px;font-size:11.5px;color:#4ade80">\u2713 Attached \u00b7 tap to change</div>';
        if(send){send.disabled=false;send.style.opacity='1'}
      }catch(e){window._payShot=null;if(box)box.innerHTML='<div class="sub" style="color:#fb7185">That image could not be read. Tap to try another.</div>'}
    };
    img.onerror=()=>{window._payShot=null;if(box)box.innerHTML='<div class="sub" style="color:#fb7185">That file is not an image. Tap to choose a screenshot.</div>'};
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
}
async function payDeclare(credits,btn){
  if(!window._payShot||!window._payShot.b64){toast('Attach your payment screenshot first.');return}
  const label=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Sending your screenshot\u2026'}
  try{
    const d=await api('/api/payments',{method:'POST',body:{credits:Number(credits),reference:'SCREENSHOT',proof_b64:window._payShot.b64,proof_name:window._payShot.name}});
    window._payShot=null;
    document.querySelectorAll('.ff-ack').forEach(x=>x.remove());
    window._homeCache=null;HM=null;cacheClear();
    try{await refreshCredits()}catch(e){}
    payPending(d);
  }catch(e){
    toast(e.message||'We could not send that. Please try again or send your screenshot on WhatsApp.');
    if(btn){btn.disabled=false;btn.textContent=label}
  }
}
/* Once a screenshot is in, the phone checks quietly for the approval and opens the way
   forward by itself: no refresh, no guessing whether the credits have landed. */
function watchPayment(paymentId){
  if(window._payWatch)return;
  const base=Number(CREDITS)||0;let n=0;
  window._payWatch=setInterval(async()=>{
    n++;if(n>240){clearInterval(window._payWatch);window._payWatch=null;return}
    if(!SESSION){clearInterval(window._payWatch);window._payWatch=null;return}
    try{
      const d=await api('/api/credits');
      const bal=Number(d.credits!=null?d.credits:d.balance)||0;
      const p=$('creditPill');if(p){CREDITS=bal;p.textContent=bal+' credit'+(bal===1?'':'s')}
      if(bal>base){
        clearInterval(window._payWatch);window._payWatch=null;
        window._homeCache=null;HM=null;cacheClear();
        document.querySelectorAll('.ff-ack').forEach(x=>x.remove());
        toast('\u2713 Payment approved. '+bal+' case'+(bal===1?'':'s')+' active. Opening your matches\u2026');
        if(window._lastMatches){go('home');setTimeout(()=>showMatches(window._lastMatches.kind,Object.assign({},window._lastMatches.opts||{})),150)}
        else go('home');
      }else if(Number(d.pending_payments)===0){
        // Closed without credits: rejected. The dashboard shows the reason in Ask us.
        clearInterval(window._payWatch);window._payWatch=null;window._homeCache=null;HM=null;if(TAB==='home')vHome();
      }
    }catch(e){}
  },8000);
}
/* A pending payment is a real state, so it gets a real screen: what was recorded, what
   happens next, and a direct way to reach a human. A toast that vanishes in four seconds
   left people unsure whether their money had registered at all. */
function payPending(d){
  const p=(d&&d.payment)||{};
  const ref='FF-'+String(p.id||'').slice(0,8).toUpperCase();
  const amt=Number((d&&d.amount_usd)||(p&&p.amount_usd)||0)||usdOf(Object.assign({},p||{},d||{}));
  const w=document.createElement('div');w.className='ff-ack';
  w.style.cssText='position:fixed;inset:0;background:rgba(4,10,24,.85);z-index:78;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:18px';
  w.innerHTML=`<div style="max-width:420px;width:100%;background:rgba(8,18,40,.97);border:1px solid rgba(45,212,191,.5);border-radius:16px;padding:20px;color:#eef4ff">
    <h3 style="margin:0 0 8px;color:#2dd4bf">Screenshot received \u2713</h3>
    <div class="sub" style="line-height:1.65">
      <div style="padding:3px 0">\u2022 Your reference: <b style="color:#EAF2FF">${esc(ref)}</b></div>
      ${amt?`<div style="padding:3px 0">\u2022 Amount: <b style="color:#EAF2FF">$${amt.toLocaleString()}</b></div>`:''}
      <div style="padding:3px 0">\u2022 Our finance desk verifies it and your cases activate, usually within 30 minutes.</div>
      <div style="padding:3px 0">\u2022 <b style="color:#EAF2FF">Keep this open or come back any time</b>: the app updates by itself the moment it is approved.</div>
      <div style="padding:3px 0">\u2022 If it cannot be matched to a transfer, we tell you why under Ask us.</div>
    </div>
    <div class="row" style="margin-top:10px;gap:8px;align-items:center"><div class="ff-pulse" style="width:9px;height:9px;border-radius:50%;background:#2dd4bf;flex:none"></div><span class="sub" id="payWaitTxt">Waiting for approval\u2026</span></div>
    <a class="btn b-line" style="width:100%;margin-top:12px;text-decoration:none;display:block;text-align:center" target="_blank" href="https://wa.me/923455216903?text=${encodeURIComponent('Assalam o Alaikum ForiForeign, I sent my payment screenshot, reference '+ref+'. Please verify.')}">Message us on WhatsApp</a>
    <button class="btn b-line" style="width:100%;margin-top:8px" onclick="this.closest('.ff-ack').remove();go('home')">Back to dashboard</button></div>`;
  document.body.appendChild(w);
  if(!document.getElementById('ffPulseCss')){const s=document.createElement('style');s.id='ffPulseCss';
    s.textContent='@keyframes ffp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}.ff-pulse{animation:ffp 1.3s ease-in-out infinite}';
    document.head.appendChild(s)}
  try{watchPayment(p.id)}catch(e){}
}
/* STAFF NEVER PAY. This grants the entitlement directly, so the owner can search and
   apply without limit and without a payment row waiting for his own approval. Client
   preview is switched off first, because that mode strips admin power by design and the
   server correctly refuses a bypass while it is on. */
async function adminBypassBuy(credits,btn){
  const label=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Activating\u2026'}
  try{
    if(localStorage.getItem('ffSimUser')==='1'){localStorage.setItem('ffSimUser','0')}
    const d=await api('/api/admin/bypass-activate',{method:'POST',body:{credits:Number(credits)||0}});
    document.querySelectorAll('.ff-ack').forEach(x=>x.remove());
    try{await refreshCredits()}catch(e){}
    toast('Activated without payment. '+(d.unlimited?'Unlimited cases':d.balance+' cases')+' ready \u2014 search and apply freely.');
    window._homeCache=null;HM=null;go('home');
  }catch(e){
    toast(e.message||'Could not activate.');
    if(btn){btn.disabled=false;btn.textContent=label}
  }
}
async function buyPack(credits){
  await refreshSiteConfig();
  const P=(SITE&&SITE.payment)||{};
  const row=(l,v)=>v?`<div class="row" style="justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(140,178,255,.14)"><span class="sub" style="font-weight:700">${l}</span><span style="display:flex;gap:8px;align-items:center"><b style="font-size:13.5px">${esc(v)}</b><button class="btn b-line" style="padding:3px 10px;font-size:11px" onclick="copyTxt('${escAttr(v)}',this)">Copy</button></span></div>`:'';
  const w=document.createElement('div');w.className='ff-ack';
  w.style.cssText='position:fixed;inset:0;background:rgba(4,10,24,.85);z-index:75;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:16px';
  w.innerHTML=`<div style="max-width:430px;width:100%;max-height:92vh;overflow:auto;background:rgba(8,18,40,.97);border:1px solid rgba(0,212,255,.5);border-radius:16px;padding:18px;color:#eef4ff">
    <div class="spread"><h3 style="margin:0">${(()=>{const t=pkgByCredits(credits);
      return 'Pay for '+(t?esc(t.name):(credits+' case'+(credits===1?'':'s')))+', one step';})()}</h3><button class="btn b-line" style="padding:3px 10px" onclick="this.closest('.ff-ack').remove()" aria-label="Close">✕</button></div>
    <div class="sub" style="margin:6px 0 8px" id="payQuote">Checking your exact amount&hellip;</div>

    ${((SITE||{}).gateway||{}).card?`<button id="payCardBtn" class="btn b-gold" style="width:100%;padding:13px;font-size:15px" onclick="payByCard(${credits},this)">\ud83d\udcb3 Pay by card - Visa, Mastercard, Apple/Google Pay (worldwide)</button>
    <div class="sub" style="text-align:center;margin:6px 0 10px;font-size:11.5px">Charged in USD on a secure checkout page. Cases activate the moment the payment clears, automatically.</div>
    <div style="display:flex;align-items:center;gap:10px;margin:6px 0"><div style="flex:1;height:1px;background:var(--line)"></div><span class="sub" style="font-size:11px">or send USD by bank transfer / Wise / Payoneer and attach the receipt</span><div style="flex:1;height:1px;background:var(--line)"></div></div>`:''}
    <div id="feeBox" class="sub" style="font-size:11.5px;line-height:1.55;margin:6px 0 10px;padding:8px 10px;border:1px dashed var(--hair-2);border-radius:10px"></div>
    <div id="payBankBlock">${row('Easypaisa',P.easypaisa_number)}${row('JazzCash',P.jazzcash_number)}${row('Bank',P.bank_name)}${row('Title',P.account_title)}${row('Account #',P.account_number)}${row('IBAN',P.iban)}
    ${!(P.easypaisa_number||P.jazzcash_number||P.account_number||P.iban)?`<div class="sub" style="padding:8px 0;color:#FFD070">Payment account details are being updated. Tap Ask us and we will send them to you right away.</div>`:''}
    <input id="payShot" type="file" accept="image/*" style="display:none" onchange="payShotPicked(this)">
    <div id="payShotBox" onclick="(document.getElementById('payShot')||{click(){}}).click()" style="margin-top:12px;border:2px dashed rgba(0,212,255,.55);border-radius:12px;padding:16px 12px;text-align:center;cursor:pointer;background:rgba(0,212,255,.05)">
      <div style="font:700 14px Inter;color:#7EE6FF">\ud83d\udcf7 Tap to attach your payment screenshot</div>
      <div class="sub" style="margin-top:4px;font-size:11.5px">From your bank, JazzCash or Easypaisa app. This is what we verify.</div>
    </div>
    <button id="payShotSend" class="btn b-gold" style="width:100%;margin-top:10px;padding:12px;font-size:15px;opacity:.55" disabled onclick="payDeclare(${credits},this)">Send screenshot, activate my cases</button>
    <div class="sub" style="margin-top:6px;text-align:center;font-size:11.5px">Cannot upload right now? <a style="color:#7EE6FF;cursor:pointer" target="_blank" href="https://wa.me/923455216903?text=${encodeURIComponent('Assalam o Alaikum ForiForeign, I have paid for the '+credits+'-case package. Here is my payment screenshot: ')}">Send it on WhatsApp</a></div>
    </div>${isTrueAdmin()?`<button class="btn b-line" style="width:100%;margin-top:8px;padding:11px;font-size:14px;border-color:#F5B841;color:#FFD070" onclick="adminBypassBuy(${credits},this)">⚡ Admin: activate without paying</button>`:''}
    ${(()=>{const rv=((SITE&&SITE.reviews)||[]).filter(r=>r&&r.text).slice(0,2);return rv.length?`<div style="margin-top:10px">${rv.map(r=>`<div style="border:1px solid rgba(245,184,65,.4);background:rgba(245,184,65,.06);border-radius:10px;padding:8px 10px;margin-top:6px"><span style="color:#FFD070">${'★'.repeat(Math.max(1,Math.min(5,r.stars||5)))}</span> <span class="sub" style="color:#EAF2FF">${esc(String(r.text).slice(0,80))}</span> <span class="sub">— ${esc(r.name||'Client')}</span></div>`).join('')}</div>`:''})()}
    <div class="sub" style="margin-top:8px;text-align:center">Every opportunity verified on official pages. Your money is safe: unverified payments are simply returned.</div></div>`;
  document.body.appendChild(w);setTimeout(()=>feeBoxLoad(credits),50);
  /* Ask the server what this actually costs THIS person: promo price if one is live,
     minus any referral balance they hold. The sheet used to quote the list price from a
     different source than the one that charges, so a customer with referral credit was
     told to send more than they owed. */
  (async()=>{
    const box=document.getElementById('payQuote');if(!box)return;

      const q=await api('/api/payments/quote?credits='+encodeURIComponent(credits));

    }catch(e){
      box.textContent='1. Send the package amount to ANY account below. 2. Attach the payment screenshot and tap Send. Done, we verify and your cases activate, usually under 30 minutes.';
    }
  })();
}
