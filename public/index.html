<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ForiForeign — Study & Work Abroad, Done For You</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213D;--gold:#C8901E;--gold-soft:#FBF3E1;--green:#1F7A54;--green-soft:#E9F5EF;--crimson:#B33; --crimson-soft:#FBEAEA;
--blue:#2563EB;--blue-soft:#EAF0FE;--slate:#5B6B7F;--line:#E7E2D9;--soft:#F7F4EE;--panel:#FFFFFF;--bg:#FBF9F5}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
h1,h2,h3,.brand{font-family:Fraunces,serif}
.brand{font-size:22px;font-weight:700}.brand b{color:var(--gold)}
header{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:none;color:#C9D2DE;padding:8px 12px;border-radius:8px;font:600 13px Inter;cursor:pointer}
nav button.on{color:#fff;border-bottom:2px solid var(--gold);border-radius:0}
main{max-width:920px;margin:0 auto;padding:18px 14px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sub{color:var(--slate);font-size:12.5px}
label{display:block;font:600 12px Inter;color:var(--slate);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:14px Inter;background:#fff}
textarea{min-height:90px}
.btn{border:none;border-radius:10px;padding:10px 16px;font:600 13.5px Inter;cursor:pointer}
.b-ink{background:var(--ink);color:#fff}.b-gold{background:var(--gold);color:#fff}.b-green{background:var(--green);color:#fff}
.b-line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font:600 11px Inter}
.c-green{background:var(--green-soft);color:var(--green)}.c-gold{background:var(--gold-soft);color:#8A6A15}
.c-gray{background:var(--soft);color:var(--slate)}.c-red{background:var(--crimson-soft);color:var(--crimson)}.c-blue{background:var(--blue-soft);color:var(--blue)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--slate);font-size:13px;background:#FDFCFA}
.credit-pill{background:var(--gold);color:#fff;border-radius:99px;padding:6px 14px;font:700 13px Inter;margin-left:auto;cursor:pointer}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;max-width:92vw;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.hero{background:var(--ink);border-radius:16px;color:#fff;padding:26px 22px;margin-bottom:16px}
.hero h1{font-size:26px}.hero p{color:#C9D2DE;margin-top:8px;font-size:13.5px;line-height:1.55}
.pack{border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:center;flex:1;min-width:140px;cursor:pointer}
.pack:hover{border-color:var(--gold)}.pack b{font-size:24px;font-family:Fraunces}
.lane{flex:1;min-width:240px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.lane:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(20,33,61,.10)}
.lane-study:hover{border-color:var(--gold)}.lane-work:hover{border-color:var(--green)}
.lane-ic{font-size:30px;line-height:1;margin-bottom:8px}
.lane h2{font-size:20px;margin-bottom:6px}
.seg{gap:6px}
.segbtn{border:1px solid var(--line);background:#fff;color:var(--slate);border-radius:99px;padding:6px 12px;font:600 12.5px Inter;cursor:pointer}
.segbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.checkrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.checkrow:last-child{border-bottom:none}
.checkbox{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.checkbox.on{background:var(--green);border-color:var(--green);color:#fff}
.checkbox.req{border-color:var(--gold)}
.progwrap{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0}
.progbar{height:100%;background:var(--green);border-radius:99px;transition:width .3s}
@media(max-width:640px){main{padding:12px 10px 70px}.lane{min-width:100%}}
</style></head>
<body>
<header>
  <span class="brand">Fori<b>Foreign</b></span>
  <nav id="nav" style="display:none">
    <button data-t="home">Home</button>
    <button data-t="browse">Opportunities</button>
    <button data-t="apps">My applications</button>
    <button data-t="profile">Profile</button>
    <button data-t="adminx" id="adminTab" style="display:none">Admin</button>
  </nav>
  <span id="creditPill" class="credit-pill" style="display:none" onclick="go('buy')">… credits</span>
  <button id="outBtn" class="btn b-line" style="display:none;padding:6px 12px" onclick="signOut()">Sign out</button>
</header>
<main id="view"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
let SB=null, SESSION=null, ME=null, TAB='home', CREDITS=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// escAttr: safe for values placed inside single-quoted JS string args in onclick=""
const escAttr=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/[<>]/g,c=>({'<':'&lt;','>':'&gt;'}[c])).replace(/\r?\n/g,' ');
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),4200)}
async function api(p,o={}){o.headers=Object.assign({'content-type':'application/json'},o.headers||{});
  if(SESSION)o.headers.authorization='Bearer '+SESSION.access_token;
  if(o.body&&typeof o.body!=='string')o.body=JSON.stringify(o.body);
  const r=await fetch(p,o);const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||('Error '+r.status));return d}

/* ---------- boot ---------- */
(async function(){
  const cfg=await (await fetch('/api/config')).json();
  if(!cfg.supabaseUrl){$('view').innerHTML='<div class="empty">Server not configured yet: SUPABASE_URL missing in Railway.</div>';return}
  SB=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  const {data}=await SB.auth.getSession();SESSION=data.session;
  SB.auth.onAuthStateChange((_e,s)=>{SESSION=s;if(s)afterLogin();});
  const q=new URLSearchParams(location.search);
  if(q.get('gmail')==='connected'){history.replaceState({},'','/');setTimeout(()=>toast('✓ Gmail connected! Your applications send from your own address.'),600)}
  else if(q.get('gmail')==='error'){history.replaceState({},'','/');setTimeout(()=>toast('Gmail connect failed: '+(q.get('why')||'')),600)}
  if(SESSION)afterLogin();else renderAuth();
})();
async function afterLogin(){
  $('nav').style.display='flex';$('outBtn').style.display='inline-block';
  try{const d=await api('/api/me');ME=d.me;CREDITS=d.credits;if(['admin','staff'].includes(ME.role))$('adminTab').style.display='inline-block';$('creditPill').style.display='inline-block';$('creditPill').textContent=CREDITS+' credit'+(CREDITS===1?'':'s');}catch(e){toast(e.message)}
  go('home');
}
async function signOut(){await SB.auth.signOut();location.reload()}
function go(t){TAB=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
document.addEventListener('click',e=>{const b=e.target.closest('#nav button');if(b){if(b.dataset.t==='browse')window._lane='';go(b.dataset.t)}});
function render(){({home:vHome,browse:vBrowse,apps:vApps,profile:vProfile,buy:vBuy,adminx:vAdmin}[TAB]||vHome)()}

/* ---------- auth view ---------- */
function renderAuth(mode){
  mode=mode||'signin';
  $('view').innerHTML=`<div class="hero"><h1>Your study and work abroad agent</h1>
  <p>ForiForeign finds verified opportunities for Pakistani students and professionals, prepares every document truthfully from your real credentials, and walks each application to the finish line. You approve, it works.</p></div>
  <div class="card" style="max-width:430px;margin:0 auto">
  <h2>${mode==='signin'?'Sign in':'Create your account'}</h2>
  <label>Email</label><input id="a-email" type="email" placeholder="you@gmail.com">
  <label>Password</label><input id="a-pass" type="password" placeholder="minimum 8 characters">
  <div class="row" style="margin-top:14px">
  <button class="btn b-gold" onclick="doAuth('${mode}')">${mode==='signin'?'Sign in':'Sign up'}</button>
  <button class="btn b-line" onclick="renderAuth('${mode==='signin'?'signup':'signin'}')">${mode==='signin'?'New here? Create account':'Have an account? Sign in'}</button></div>
  <div class="sub" style="margin-top:10px">${mode==='signup'?'You will receive a verification email. Verify, then sign in.':''}</div></div>`;
}
async function doAuth(mode){
  const email=$('a-email').value.trim(),password=$('a-pass').value;
  if(!email||password.length<8){toast('Enter email and a password of at least 8 characters');return}
  try{
    if(mode==='signup'){
      const {error}=await SB.auth.signUp({email,password});
      if(error)throw error;
      toast('Account created. Check your email for the verification link, then sign in.');renderAuth('signin');
    }else{
      const {error}=await SB.auth.signInWithPassword({email,password});
      if(error)throw error;
    }
  }catch(e){toast(e.message)}
}

/* ---------- home ---------- */
async function vHome(){
  $('view').innerHTML=`<div class="hero"><h1>Assalam o alaikum, ${esc((ME&&ME.full_name)||'')}</h1>
  <p id="readyLine">Building your profile intelligence…</p></div>
  <div id="readyCard" class="card"><span class="sub">Loading your readiness…</span></div>
  <div class="row" style="gap:12px;margin:14px 0">
    <div class="lane lane-study" onclick="window._lane='study';go('browse')"><div class="lane-ic">🎓</div><h3>Study Abroad</h3><div class="sub">BS to Postdoc, scholarships and funding filters.</div></div>
    <div class="lane lane-work" onclick="window._lane='work';go('browse')"><div class="lane-ic">💼</div><h3>Work Abroad</h3><div class="sub">Jobs with the licensing route named for you.</div></div>
  </div>
  <div class="card spread" style="cursor:pointer" onclick="runSearch()"><div><h3>Find opportunities for me now</h3><div class="sub">Profile-driven search of official sources</div></div><span style="font-size:22px">→</span></div>
  <div class="card spread" style="cursor:pointer" onclick="go('apps')"><div><h3>My applications</h3><div class="sub">Every case and where it stands</div></div><span style="font-size:22px">→</span></div>
  <div class="card spread" style="cursor:pointer;border-color:var(--gold)" onclick="go('buy')"><div><h3>Buy credits</h3><div class="sub">1 credit = 1 complete application, prepared end to end</div></div><span style="font-size:22px">→</span></div>`;
  loadReadiness();
}
async function loadReadiness(){
  let d;try{d=await api('/api/profile/readiness')}catch(e){const c=$('readyCard');if(c)c.innerHTML='<span class="sub">'+esc(e.message)+'</span>';return}
  const line=$('readyLine');
  if(line)line.innerHTML=d.pct>=60?`Your profile is <b style="color:#fff">${d.pct}%</b> ready. Keep it complete so every application is stronger.`
    :`Let's build your profile. Upload your CV and documents once, and the agent understands your background for every opportunity.`;
  const c=$('readyCard');if(!c)return;
  const statusChip=s=>({verified:'c-green',provided:'c-blue',required:'c-red',recommended:'c-gold'}[s]||'c-gray');
  const statusWord=s=>({verified:'Verified',provided:'Provided',required:'Required',recommended:'Recommended'}[s]||s);
  c.innerHTML=`<div class="spread"><h3>Profile readiness</h3><b style="font-family:Fraunces;font-size:22px">${d.pct}%</b></div>
  <div class="progwrap"><div class="progbar" style="width:${d.pct}%"></div></div>
  ${d.actions.length?`<div class="card" style="background:var(--gold-soft);border-color:var(--gold);margin:8px 0"><b>Recommended next:</b>
    <div style="margin-top:6px">${d.actions.map((a,i)=>`<div style="padding:3px 0">${i+1}. ${esc(a.label)} ${a.required?'<span class="chip c-red">required</span>':'<span class="chip c-gold">recommended</span>'}</div>`).join('')}</div>
    <button class="btn b-gold" style="margin-top:8px" onclick="go('profile')">Complete my profile →</button></div>`:'<div class="sub" style="margin:8px 0;color:var(--green)">✓ Your profile covers all required sections.</div>'}
  <div style="margin-top:6px">${d.sections.map(s=>`<div class="checkrow">
    <div class="checkbox ${s.filled?'on':(s.required?'req':'')}">${s.filled?'✓':''}</div>
    <div style="flex:1;min-width:0"><span style="font-weight:600">${esc(s.label)}</span></div>
    <span class="chip ${statusChip(s.status)}">${statusWord(s.status)}</span></div>`).join('')}</div>`;
}

/* ---------- Opportunities: commercial two-lane entry ---------- */
// window._lane: '' (chooser) | 'study' | 'work'
async function vBrowse(){
  const lane=window._lane||'';
  if(!lane){ renderLaneChooser(); return; }
  if(lane==='study'){ renderStudyLane(); return; }
  if(lane==='work'){ renderWorkLane(); return; }
}
function renderLaneChooser(){
  $('view').innerHTML=`<div class="hero" style="padding:22px"><h1>Where do you want to go?</h1>
  <p>Pick a lane. Every listing here has been checked against its official source, so you are never chasing dead links.</p></div>
  <div class="row" style="gap:12px">
    <div class="lane lane-study" onclick="window._lane='study';vBrowse()">
      <div class="lane-ic">🎓</div>
      <h2>Study Abroad</h2>
      <p class="sub">Bachelors, Masters, PhD and Postdoc — plus scholarships built in. Filter by funding: fully funded, partial, or self-finance.</p>
      <span class="btn b-gold" style="margin-top:12px;pointer-events:none">Explore study routes →</span>
    </div>
    <div class="lane lane-work" onclick="window._lane='work';vBrowse()">
      <div class="lane-ic">💼</div>
      <h2>Work Abroad</h2>
      <p class="sub">Real jobs for Pakistani professionals, with the exact license or registration route named for each destination (DHA, SCFHS, NCLEX, PEBC and more).</p>
      <span class="btn b-green" style="margin-top:12px;pointer-events:none">Explore work routes →</span>
    </div>
  </div>`;
}

async function ensureCountries(){
  if(!window._countries){try{window._countries=(await api('/api/countries')).countries||[]}catch(e){window._countries=[]}}
  return window._countries;
}
function laneBar(active){
  return `<div class="row" style="margin-bottom:12px;align-items:center">
    <button class="btn b-line" onclick="window._lane='';vBrowse()">← All lanes</button>
    <button class="btn ${active==='study'?'b-gold':'b-line'}" onclick="window._lane='study';vBrowse()">🎓 Study</button>
    <button class="btn ${active==='work'?'b-green':'b-line'}" onclick="window._lane='work';vBrowse()">💼 Work</button>
  </div>`;
}
function matchBadge(m){
  if(!m||!m.status)return '';
  const map={eligible:['c-green','Eligible'],potentially_eligible:['c-gold','Potentially eligible'],not_eligible:['c-red','Not eligible'],criteria_not_published:['c-gray','Criteria not published']};
  const [cls,word]=map[m.status]||['c-gray',m.status];
  const pct=(m.pct!=null)?' · '+m.pct+'%':'';
  return `<span class="chip ${cls}">${word}${pct}</span>`;
}
function oppCard(o,ctaColor){
  const fundingChip = o.funding_type==='fully'?'<span class="chip c-green">Fully funded</span>'
    : o.funding_type==='partial'?'<span class="chip c-gold">Partial funding</span>'
    : o.funding_type==='self'?'<span class="chip c-gray">Self-finance</span>':'';
  const levelChip = o.level?`<span class="chip c-blue">${esc(({bachelors:'Bachelors',masters:'Masters',phd:'PhD',postdoc:'Postdoc'})[o.level]||o.level)}</span>`:'';
  return `<div class="card">
    <div class="spread"><div style="min-width:0"><b>${esc(o.institution)}</b><div class="sub">${esc(o.title)}</div></div>
    ${o.country_code?`<span class="chip c-blue">${esc(o.country_code)}</span>`:''}</div>
    <div class="row" style="margin-top:8px">
    ${matchBadge(o.match)}${levelChip}${fundingChip}
    ${o.deadline?`<span class="chip c-gray">Deadline ${esc(o.deadline)}</span>`:''}
    ${o.funding&&!fundingChip?`<span class="chip c-green">${esc(o.funding)}</span>`:''}
    ${o.stipend?`<span class="chip c-green">${esc(o.stipend)}</span>`:''}</div>
    <div class="row" style="margin-top:10px">
    <button class="btn ${ctaColor||'b-gold'}" onclick="startApp('${o.id}','${escAttr(o.institution)}')">Start application (1 credit)</button>
    <button class="btn b-line" onclick="whyMatch('${o.id}')">Why you match</button>
    <a class="btn b-line" href="${esc(o.url)}" target="_blank" rel="noopener">Official page ↗</a></div></div>`;
}
async function whyMatch(id){
  toast('Checking your eligibility…');
  let d;try{d=await api('/api/opportunities/'+id+'/match')}catch(e){toast(e.message);return}
  const map={eligible:['c-green','Eligible'],potentially_eligible:['c-gold','Potentially eligible'],not_eligible:['c-red','Not eligible'],criteria_not_published:['c-gray','Criteria not published']};
  const [cls,word]=map[d.status]||['c-gray',d.status];
  const icon=o=>o==='yes'?'<span style="color:var(--green)">✓</span>':o==='no'?'<span style="color:var(--crimson)">✕</span>':'<span style="color:var(--gold)">?</span>';
  const wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;inset:0;background:rgba(20,33,61,.5);z-index:60;overflow:auto;padding:20px 10px';
  wrap.innerHTML=`<div style="max-width:560px;margin:0 auto;background:#fff;border-radius:16px;padding:18px">
  <div class="spread"><h2>Why you match</h2><button class="btn b-line" onclick="this.closest('div[style*=fixed]').remove()">✕</button></div>
  <div class="sub" style="margin:4px 0">${esc((d.opportunity||{}).institution||'')} · ${esc((d.opportunity||{}).title||'')}</div>
  <div class="row" style="margin:8px 0"><span class="chip ${cls}">${word}</span>${d.pct!=null?`<span class="chip c-blue">${d.pct}% of stated criteria met</span>`:''}</div>
  ${d.status==='criteria_not_published'?'<div class="card" style="background:var(--soft)"><div class="sub">This opportunity did not publish structured eligibility criteria, so we cannot compute a match. Check the official page for requirements.</div></div>':''}
  ${(d.reasons||[]).map(r=>`<div class="checkrow"><div style="flex:none;width:20px">${icon(r.ok)}</div><div style="flex:1" class="sub">${esc(r.text)}</div></div>`).join('')}
  <div class="sub" style="margin-top:10px;font-size:11px">Unknown items (?) mean the requirement is stated but your profile does not yet have the data, or the requirement was not published. They are never counted as met.</div>
  <div class="row" style="margin-top:12px"><button class="btn b-gold" onclick="this.closest('div[style*=fixed]').remove();startApp('${id}','${escAttr((d.opportunity||{}).institution||'')}')">Start application (1 credit)</button></div></div>`;
  document.body.appendChild(wrap);
}

/* ---- STUDY lane: level + funding + country + subject filters, scholarships inside ---- */
async function renderStudyLane(){
  await ensureCountries();
  const st=window._study||(window._study={level:'',funding:'',ctry:'',subj:''});
  $('view').innerHTML=laneBar('study')+`
  <h2 style="margin-bottom:2px">Study Abroad</h2>
  <div class="sub" style="margin-bottom:10px">All levels from Bachelors to Postdoc, scholarships included. Verified against official pages.</div>
  <div class="card" style="padding:12px">
    <label style="margin-top:0">Level</label>
    <div class="row seg">${[['','All levels'],['bachelors','Bachelors'],['masters','Masters'],['phd','PhD'],['postdoc','Postdoc']].map(([v,l])=>`<button class="segbtn ${st.level===v?'on':''}" onclick="window._study.level='${v}';renderStudyLane()">${l}</button>`).join('')}</div>
    <label>Funding</label>
    <div class="row seg">${[['','Any funding'],['fully','Fully funded'],['partial','Partial'],['self','Self-finance']].map(([v,l])=>`<button class="segbtn ${st.funding===v?'on':''}" onclick="window._study.funding='${v}';renderStudyLane()">${l}</button>`).join('')}</div>
    <div class="row" style="margin-top:10px">
      <select style="width:auto" onchange="window._study.ctry=this.value;renderStudyLane()"><option value="">All countries</option>${(window._countries||[]).map(c=>`<option value="${c.code}" ${st.ctry===c.code?'selected':''}>${esc(c.name)} ${c.study_rating==='green'?'🟢':c.study_rating==='yellow'?'🟡':'🔴'}</option>`).join('')}</select>
      <input id="study-subj" style="width:auto;flex:1;min-width:150px" placeholder="Subject, e.g. pharmacology" value="${escAttr(st.subj)}" onkeydown="if(event.key==='Enter'){window._study.subj=this.value;renderStudyLane()}" onchange="window._study.subj=this.value;renderStudyLane()">
      <button class="btn b-ink" onclick="window._study.subj=(document.getElementById('study-subj')||{}).value||'';renderStudyLane()">Search</button>
    </div>
  </div>
  <div id="studyResults"><div class="empty">Loading verified opportunities…</div></div>`;
  let d;
  try{
    const qs='/api/opportunities?kind=study'+(st.ctry?'&country='+encodeURIComponent(st.ctry):'')+(st.funding?'&funding_type='+st.funding:'')+(st.level?'&level='+st.level:'')+(st.subj?'&q='+encodeURIComponent(st.subj):'')+'&match=1';
    d=await api(qs);
  }catch(e){const el=$('studyResults');if(el)el.innerHTML='<div class="empty">'+esc(e.message)+'</div>';return}
  const opps=d.opportunities||[];const el=$('studyResults');if(!el)return;
  el.innerHTML=opps.length?opps.map(o=>oppCard(o,'b-gold')).join('')

  toast('Re-reading your documents…');
  try{const d=await api('/api/profile/autofill',{method:'POST'});
    toast('Done. Filled: '+((d.filled||[]).join(', ')||'nothing new')+(d.refsAdded?(' and '+d.refsAdded+' referees'):''));
    const me=await api('/api/me');ME=me.me;vProfile();
  }catch(e){toast(e.message)}}
async function viewDoc(id){
  try{const d=await api('/api/documents/'+id+'/url');window.open(d.url,'_blank')}catch(e){toast(e.message)}}
async function delDoc(id){
  if(!confirm('Delete this document? This cannot be undone.'))return;
  try{await api('/api/documents/'+id,{method:'DELETE'});toast('Deleted.');loadDocs();loadChecklist();}catch(e){toast(e.message)}}
async function saveProfile(){
  const lines=id=>$(id).value.split('\n').map(x=>x.trim()).filter(Boolean);
  try{const d=await api('/api/me',{method:'PUT',body:{
    full_name:$('p-name').value,phone:$('p-phone').value,mode:$('p-mode').value,
    headline:$('p-head').value,field:$('p-field').value,methods:$('p-methods').value,annual_budget_pkr:Number($('p-budget').value||0),funded_only:$('p-funded').checked,profession:$('p-prof').value||null,
    education:lines('p-edu').map(l=>{const p=l.split(',').map(x=>x.trim());return{degree:p[0]||'',institution:p[1]||'',year:p[2]||''}}),
    publications:lines('p-pubs'),
    experience:lines('p-exp').map(l=>{const p=l.split(',').map(x=>x.trim());return{role:p[0]||'',org:p[1]||'',years:p[2]||''}})
  }});ME=d.me;toast('Profile saved.');}catch(e){toast(e.message)}
}
async function vAdmin(){
  $('view').innerHTML='<div class="empty">Loading…</div>';
  let d;try{d=await api('/api/admin/overview')}catch(e){$('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>';return}
  $('view').innerHTML=`<h2 style="margin-bottom:10px">Admin</h2>
  <div class="row" style="margin-bottom:12px">
  <div class="card" style="flex:1;text-align:center"><b style="font-size:22px;font-family:Fraunces">${d.users}</b><div class="sub">Users</div></div>
  <div class="card" style="flex:1;text-align:center"><b style="font-size:22px;font-family:Fraunces">${d.applications}</b><div class="sub">Applications</div></div>
  <div class="card" style="flex:1;text-align:center"><b style="font-size:22px;font-family:Fraunces">$${d.aiCostUsd}</b><div class="sub">AI cost</div></div></div>
  <div class="card"><h3>Pending payments</h3>
  ${(d.pendingPayments||[]).length?d.pendingPayments.map(p=>`<div class="spread" style="padding:8px 0;border-bottom:1px solid var(--line)">
  <div><b>${esc((p.profiles||{}).full_name||'')}</b> · ${p.credits} credits · PKR ${Number(p.amount_pkr).toLocaleString()}<div class="sub">Ref: ${esc(p.reference||'none')} · ${esc((p.created_at||'').slice(0,16).replace('T',' '))}</div></div>
  <button class="btn b-green" onclick="confirmPay('${p.id}',this)">Confirm</button></div>`).join('')
  :'<div class="sub">No pending payments.</div>'}</div>`;
}
async function confirmPay(id,btn){btn.disabled=true;
  try{await api('/api/payments/'+id+'/confirm',{method:'POST'});toast('Confirmed, credits granted.');vAdmin();}
  catch(e){toast(e.message);btn.disabled=false}}
/* ---------- buy credits ---------- */
async function vBuy(){
  $('view').innerHTML='<div class="empty">Loading credit packs…</div>';
  let d;try{d=await api('/api/pricing')}catch(e){$('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>';return}
  const packs=((d.pricing||{}).packs)||[];
  $('view').innerHTML=`<h2 style="margin-bottom:4px">Buy credits</h2>
  <div class="sub" style="margin-bottom:12px">1 credit = 1 complete application prepared end to end. Pay by bank transfer, our team confirms, credits appear.</div>
  <div class="row">${packs.map(p=>`<div class="pack" onclick="buyPack(${p.credits})"><b>${p.credits}</b><div class="sub">credit${p.credits===1?'':'s'}</div>
  <div style="margin-top:6px;font-weight:700">${p.pkr>0?'PKR '+p.pkr.toLocaleString():'Pricing soon'}</div></div>`).join('')}</div>
  <div class="card" style="margin-top:14px"><h3>How it works</h3>
  <div class="sub" style="margin-top:6px;line-height:1.7">1. Choose a pack and note the reference code shown.<br>2. Transfer the amount to the bank account shown.<br>3. Enter your bank reference, submit.<br>4. Our team confirms, usually within a few hours, and your credits appear. ${esc((d.pricing||{}).refund_policy||'')}</div></div>`;
}
async function buyPack(credits){
  const ref=prompt('After transferring, paste your bank transfer reference here (or type PENDING to submit now and add it later):');
  if(ref===null)return;
  try{const d=await api('/api/payments',{method:'POST',body:{credits,reference:ref}});
  toast(d.note||'Submitted for confirmation.');}catch(e){toast(e.message)}
}
</script>
</body></html>
